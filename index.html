<!DOCTYPE html>
<html lang="en-NZ">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Antithetical Conjunction - Payment Details</title>


    <style>

        /* ==========================================
           PAGE
        ========================================== */

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;
        }


        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            background-image:
                url("image-1024.jpg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            min-height: 100vh;

            overflow: hidden;

            position: relative;
        }



        /* ==========================================
           BUTTON
        ========================================== */

        .bank-container {

            position: absolute;

            top: 40%;

            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 240px;

            z-index: 100;
        }


        .share-btn {

            width: 100%;

            padding: 24px;

            background: #ffffff;

            color: #000000;

            border: none;

            border-radius: 8px;

            font-size: 19px;

            font-weight: 700;

            letter-spacing: 0.2px;

            cursor: pointer;

            box-shadow:
                0 5px 18px
                rgba(0, 0, 0, 0.5);

            position: relative;

            z-index: 200;
        }


        .share-btn:hover {

            background: #eeeeee;
        }


        .share-btn:active {

            transform: scale(0.97);
        }



        /* ==========================================
           BLOOD EFFECT
        ========================================== */

        .blood {

            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            pointer-events: none;

            z-index: 50;

            opacity: 0;
        }


        .blood.active {

            opacity: 1;
        }



        /* ==========================================
           MAIN CARTOON BLOOD SPLAT
        ========================================== */

        .blood-main {

            position: absolute;

            left: 50%;
            top: 40%;

            width: 650px;
            height: 500px;

            transform:
                translate(-50%, -50%)
                scale(0);

            transform-origin:
                center;

            background:

                radial-gradient(
                    ellipse at center,

                    #a90000 0%,
                    #850000 58%,
                    #650000 100%
                );

            /*
                Very rounded cartoon shape.
            */

            border-radius:

                53% 47% 49% 51%
                /
                48% 55% 45% 52%;

            box-shadow:

                0 8px 15px
                rgba(0,0,0,0.3);

            opacity: 0;

            transition:

                transform
                0.55s
                cubic-bezier(.15,1.25,.25,1),

                opacity
                0.1s ease;
        }


        .blood.active .blood-main {

            transform:
                translate(-50%, -50%)
                scale(1);

            opacity: 1;
        }



        /* ==========================================
           CARTOON BLOOD BLOBS
        ========================================== */

        .blood-blob {

            position: absolute;

            background:
                #790000;

            border-radius: 50%;

            opacity: 0;

            transform:
                scale(0);

            transition:

                transform
                0.55s
                cubic-bezier(.1,1.2,.2,1),

                opacity
                0.1s ease;
        }


        .blood.active .blood-blob {

            transform:
                scale(1);

            opacity: 1;
        }


        /* Left blob */

        .blob-left {

            width: 170px;
            height: 105px;

            left: 3%;
            top: 39%;

            transform:
                rotate(-18deg)
                scale(0);
        }


        /* Right blob */

        .blob-right {

            width: 190px;
            height: 115px;

            right: 2%;
            top: 41%;

            transform:
                rotate(15deg)
                scale(0);
        }


        /* Top blob */

        .blob-top {

            width: 130px;
            height: 90px;

            left: 43%;
            top: 4%;

            transform:
                scale(0);
        }


        /* Bottom blob */

        .blob-bottom {

            width: 150px;
            height: 100px;

            left: 48%;
            bottom: 3%;

            transform:
                rotate(-10deg)
                scale(0);
        }



        /* ==========================================
           LITTLE CARTOON SPLASH DROPS
        ========================================== */

        .splash-drop {

            position: absolute;

            background:
                #850000;

            border-radius: 50%;

            opacity: 0;

            transform:
                scale(0);

            transition:

                transform
                0.45s
                cubic-bezier(.1,1.3,.2,1),

                opacity
                0.1s ease;
        }


        .blood.active .splash-drop {

            transform:
                scale(1);

            opacity: 1;
        }


        .drop-1 {

            width: 35px;
            height: 35px;

            left: 8%;
            top: 28%;
        }


        .drop-2 {

            width: 22px;
            height: 22px;

            left: 18%;
            top: 18%;

            transition-delay:
                0.08s;
        }


        .drop-3 {

            width: 30px;
            height: 30px;

            right: 12%;
            top: 25%;

            transition-delay:
                0.12s;
        }


        .drop-4 {

            width: 18px;
            height: 18px;

            right: 20%;
            top: 15%;

            transition-delay:
                0.18s;
        }


        .drop-5 {

            width: 27px;
            height: 27px;

            left: 13%;
            bottom: 27%;

            transition-delay:
                0.1s;
        }


        .drop-6 {

            width: 20px;
            height: 20px;

            right: 9%;
            bottom: 23%;

            transition-delay:
                0.15s;
        }



        /* ==========================================
           CARTOON PAINT ARMS
        ========================================== */

        .blood-arm {

            position: absolute;

            background:
                #790000;

            border-radius:
                50%;

            opacity: 0;

            transform:
                scaleX(0);

            transform-origin:
                center;

            transition:

                transform
                0.65s
                cubic-bezier(.1,1.1,.2,1),

                opacity
                0.1s ease;
        }


        .blood.active .blood-arm {

            transform:
                scaleX(1);

            opacity: 1;
        }


        .arm-left {

            width: 360px;
            height: 55px;

            left: -190px;
            top: 42%;

            transform:
                rotate(-12deg)
                scaleX(0);
        }


        .arm-right {

            width: 380px;
            height: 58px;

            right: -210px;
            top: 45%;

            transform:
                rotate(12deg)
                scaleX(0);
        }


        .arm-top {

            width: 300px;
            height: 45px;

            left: 30%;
            top: -120px;

            transform:
                rotate(-15deg)
                scaleX(0);
        }



        /* ==========================================
           THICK CARTOON DRIPS
        ========================================== */

        .blood-drip {

            position: absolute;

            background:
                linear-gradient(
                    to bottom,

                    #850000,
                    #620000
                );

            border-radius:
                0 0 50% 50%;

            opacity: 0;

            transform:
                scaleY(0);

            transform-origin:
                top;

            transition:

                transform
                0.75s
                cubic-bezier(.15,.9,.2,1),

                opacity
                0.2s ease;
        }


        .blood.active .blood-drip {

            transform:
                scaleY(1);

            opacity: 1;
        }


        .drip-1 {

            left: 25%;
            top: 58%;

            width: 38px;
            height: 180px;

            transition-delay:
                0.1s;
        }


        .drip-2 {

            left: 39%;
            top: 57%;

            width: 23px;
            height: 125px;

            transition-delay:
                0.2s;
        }


        .drip-3 {

            left: 50%;
            top: 56%;

            width: 52px;
            height: 240px;

            transition-delay:
                0.05s;
        }


        .drip-4 {

            left: 63%;
            top: 58%;

            width: 27px;
            height: 160px;

            transition-delay:
                0.15s;
        }


        .drip-5 {

            left: 74%;
            top: 57%;

            width: 42px;
            height: 195px;

            transition-delay:
                0.25s;
        }



        /* ==========================================
           BLOOD DISAPPEARS
        ========================================== */

        .blood.draining {

            opacity: 0;

            transition:

                opacity
                1.8s
                ease;
        }


        /*
            Make the individual drips retract
            at the same time.
        */

        .blood.draining
        .blood-drip {

            transform:
                scaleY(0);

            opacity: 0;

            transition:

                transform
                1s ease-in,

                opacity
                0.8s ease;
        }



        /* ==========================================
           THANK YOU MESSAGE
        ========================================== */

        .thanks-message {

            position: absolute;

            top:
                calc(100% + 32px);

            left: 50%;

            transform:
                translateX(-50%)
                translateY(10px);

            width: 340px;

            text-align: center;

            opacity: 0;

            z-index: 80;

            pointer-events: none;

            transition:

                opacity
                1s ease,

                transform
                1s ease;
        }


        .thanks-message.show {

            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);
        }



        /* ==========================================
           DRIPPING BLOOD LETTERING
        ========================================== */

        .thanks-text {

            position: relative;

            display: inline-block;

            color:
                #720000;

            font-family:

                Georgia,
                "Times New Roman",
                serif;

            font-size:
                23px;

            font-weight:
                900;

            line-height:
                1.25;

            letter-spacing:
                0.3px;

            text-shadow:

                1px 2px 0
                #350000,

                0 3px 6px
                rgba(0,0,0,0.55);
        }


        /*
            BIG DRIPS HANGING FROM
            THE WORDS
        */

        .thanks-text::before {

            content: "";

            position: absolute;

            left: 8%;

            bottom: -29px;

            width: 10px;
            height: 38px;

            background:
                #720000;

            border-radius:
                0 0 50% 50%;

            box-shadow:

                43px 8px 0 -1px #720000,

                92px 2px 0 -2px #720000,

                145px 9px 0 -2px #720000,

                205px 3px 0 -3px #720000;
        }


        .thanks-text::after {

            content: "";

            position: absolute;

            right: 6%;

            bottom: -20px;

            width: 7px;
            height: 28px;

            background:
                #720000;

            border-radius:
                0 0 50% 50%;
        }



        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            .bank-container {

                width: 225px;

                top: 30%;
            }


            .share-btn {

                padding: 20px;

                font-size: 17px;
            }


            .blood-main {

                width: 560px;
                height: 470px;
            }


            .blood-arm {

                display: none;
            }


            .blood-blob {

                transform:
                    scale(0.8);
            }


            .thanks-message {

                width: 285px;
            }


            .thanks-text {

                font-size: 19px;
            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         BLOOD
    ========================================== -->

    <div
        class="blood"
        id="blood"
    >

        <!-- MAIN ROUNDED SPLAT -->

        <div
            class="blood-main"
        ></div>


        <!-- BIG ROUNDED BLOBS -->

        <div
            class="blood-blob blob-left"
        ></div>

        <div
            class="blood-blob blob-right"
        ></div>

        <div
            class="blood-blob blob-top"
        ></div>

        <div
            class="blood-blob blob-bottom"
        ></div>


        <!-- PAINT ARMS -->

        <div
            class="blood-arm arm-left"
        ></div>

        <div
            class="blood-arm arm-right"
        ></div>

        <div
            class="blood-arm arm-top"
        ></div>


        <!-- SMALL SPLASH DROPS -->

        <div
            class="splash-drop drop-1"
        ></div>

        <div
            class="splash-drop drop-2"
        ></div>

        <div
            class="splash-drop drop-3"
        ></div>

        <div
            class="splash-drop drop-4"
        ></div>

        <div
            class="splash-drop drop-5"
        ></div>

        <div
            class="splash-drop drop-6"
        ></div>


        <!-- THICK DRIPS -->

        <div
            class="blood-drip drip-1"
        ></div>

        <div
            class="blood-drip drip-2"
        ></div>

        <div
            class="blood-drip drip-3"
        ></div>

        <div
            class="blood-drip drip-4"
        ></div>

        <div
            class="blood-drip drip-5"
        ></div>

    </div>



    <!-- ==========================================
         BUTTON
    ========================================== -->

    <div class="bank-container">

        <button
            class="share-btn"
            id="copyDetailsBtn"
            onclick="copyCombinedDetails()"
        >
            Copy Bank Details
        </button>


        <!-- BLOODY MESSAGE -->

        <div
            class="thanks-message"
            id="thanksMessage"
        >

            <div class="thanks-text">

                Thanks for supporting live music :)

            </div>

        </div>

    </div>



    <script>


        /* ==========================================
           COPY BANK DETAILS
        ========================================== */

        async function copyCombinedDetails() {


            const name =
                "TAI VAN DER BAR";


            const number =
                "38-9005-0490046-02";


            const dynamicText =
                `${name}\n${number}`;


            const button =
                document.getElementById(
                    "copyDetailsBtn"
                );


            const blood =
                document.getElementById(
                    "blood"
                );


            const message =
                document.getElementById(
                    "thanksMessage"
                );


            try {


                /* ==============================
                   COPY
                ============================== */

                await navigator.clipboard.writeText(
                    dynamicText
                );


                /* ==============================
                   BUTTON
                ============================== */

                button.innerText =
                    "Copied!";


                /* ==============================
                   EXPLODE
                ============================== */

                blood.classList.add(
                    "active"
                );


                /* ==============================
                   LET THE BLOOD SIT
                ============================== */

                setTimeout(function() {


                    /*
                        Blood starts disappearing.
                    */

                    blood.classList.add(
                        "draining"
                    );


                }, 3000);


                /* ==============================
                   REVEAL MESSAGE AFTER BLOOD
                   HAS MOSTLY DISAPPEARED
                ============================== */

                setTimeout(function() {


                    message.classList.add(
                        "show"
                    );


                }, 4400);


                /* ==============================
                   RESET BUTTON
                ============================== */

                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                }, 5000);

            }


            catch (err) {


                console.error(
                    "Could not copy details:",
                    err
                );


                button.innerText =
                    "Copy Failed";


                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                }, 2500);

            }

        }

    </script>


</body>

</html>
