<!DOCTYPE html>
<html lang="en-NZ">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Antithetical Conjunction - Payment Details</title>


    <!-- Blood-style font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Nosifer&display=swap"
        rel="stylesheet"
    >


    <style>

        /* ==========================================
           COLOUR
        ========================================== */

        :root {
            --blood: #850000;
        }



        /* ==========================================
           PAGE
        ========================================== */

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;
        }


        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            background-image:
                url("image-1024.jpg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            min-height: 100vh;

            overflow: hidden;

            position: relative;
        }



        /* ==========================================
           BUTTON
        ========================================== */

        .bank-container {

            position: absolute;

            top: 40%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 240px;

            z-index: 100;
        }


        .share-btn {

            width: 100%;

            padding: 24px;

            background: #ffffff;

            color: #000000;

            border: none;

            border-radius: 8px;

            font-size: 19px;

            font-weight: 700;

            letter-spacing: 0.2px;

            cursor: pointer;

            box-shadow:
                0 5px 18px
                rgba(0, 0, 0, 0.5);

            position: relative;

            z-index: 200;
        }


        .share-btn:hover {

            background: #eeeeee;
        }


        .share-btn:active {

            transform: scale(0.97);
        }



        /* ==========================================
           BLOOD CONTAINER
        ========================================== */

        .blood {

            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            pointer-events: none;

            z-index: 50;

            opacity: 0;
        }


        .blood.active {

            opacity: 1;
        }



        /* ==========================================
           MAIN CENTRAL SPLAT
        ========================================== */

        .blood-main {

            position: absolute;

            left: 50%;
            top: 40%;

            width: 650px;
            height: 500px;

            transform:
                translate(-50%, -50%)
                scale(0);

            transform-origin: center;

            background: var(--blood);

            border-radius:
                52% 48% 50% 50%
                /
                48% 54% 46% 52%;

            box-shadow:
                0 8px 15px
                rgba(0, 0, 0, 0.3);

            opacity: 0;

            transition:
                transform
                0.55s
                cubic-bezier(.15, 1.25, .25, 1),

                opacity
                0.1s ease;
        }


        .blood.active .blood-main {

            transform:
                translate(-50%, -50%)
                scale(1);

            opacity: 1;
        }



        /* ==========================================
           SPLAT ARMS
           
           These create the single continuous
           "paint explosion" coming from every side.
        ========================================== */

        .blood-arm {

            position: absolute;

            left: 50%;
            top: 40%;

            background: var(--blood);

            border-radius: 999px;

            opacity: 0;

            transform-origin: left center;

            transform:
                translateY(-50%)
                scaleX(0);

            transition:
                transform
                0.65s
                cubic-bezier(.1, 1.1, .2, 1),

                opacity
                0.1s ease;
        }


        .blood.active .blood-arm {

            opacity: 1;

            transform:
                translateY(-50%)
                scaleX(1);
        }



        /* ==========================================
           LEFT
        ========================================== */

        .arm-left {

            width: 430px;
            height: 75px;

            margin-left: -625px;

            transform-origin: right center;

            transform:
                rotate(-8deg)
                scaleX(0);
        }


        .blood.active .arm-left {

            transform:
                rotate(-8deg)
                scaleX(1);
        }



        /* ==========================================
           RIGHT
        ========================================== */

        .arm-right {

            width: 450px;
            height: 78px;

            margin-left: 300px;

            transform:
                rotate(8deg)
                scaleX(0);
        }


        .blood.active .arm-right {

            transform:
                rotate(8deg)
                scaleX(1);
        }



        /* ==========================================
           TOP
        ========================================== */

        .arm-top {

            width: 390px;
            height: 70px;

            margin-left: -195px;

            margin-top: -250px;

            transform-origin: center bottom;

            transform:
                rotate(-10deg)
                scaleY(0);
        }


        .blood.active .arm-top {

            transform:
                rotate(-10deg)
                scaleY(1);
        }



        /* ==========================================
           BOTTOM
        ========================================== */

        .arm-bottom {

            width: 420px;
            height: 78px;

            margin-left: -210px;

            margin-top: 210px;

            transform-origin: center top;

            transform:
                rotate(8deg)
                scaleY(0);
        }


        .blood.active .arm-bottom {

            transform:
                rotate(8deg)
                scaleY(1);
        }



        /* ==========================================
           DIAGONAL SPLAT PILLARS
           
           These fill out the corners so it feels
           like one giant splat rather than a circle
           with four simple arms.
        ========================================== */

        .blood-diagonal {

            position: absolute;

            left: 50%;
            top: 40%;

            background: var(--blood);

            border-radius: 999px;

            opacity: 0;

            width: 330px;
            height: 62px;

            transform-origin: left center;

            transform:
                scaleX(0);

            transition:
                transform
                0.6s
                cubic-bezier(.1, 1.15, .2, 1),

                opacity
                0.1s ease;
        }


        .blood.active .blood-diagonal {

            opacity: 1;

            transform:
                scaleX(1);
        }



        /* Top-left */

        .diagonal-tl {

            margin-left: -490px;
            margin-top: -185px;

            transform:
                rotate(-28deg)
                scaleX(0);
        }


        .blood.active .diagonal-tl {

            transform:
                rotate(-28deg)
                scaleX(1);
        }



        /* Top-right */

        .diagonal-tr {

            margin-left: 160px;
            margin-top: -180px;

            transform:
                rotate(-152deg)
                scaleX(0);
        }


        .blood.active .diagonal-tr {

            transform:
                rotate(-152deg)
                scaleX(1);
        }



        /* Bottom-left */

        .diagonal-bl {

            margin-left: -490px;
            margin-top: 180px;

            transform:
                rotate(28deg)
                scaleX(0);
        }


        .blood.active .diagonal-bl {

            transform:
                rotate(28deg)
                scaleX(1);
        }



        /* Bottom-right */

        .diagonal-br {

            margin-left: 160px;
            margin-top: 175px;

            transform:
                rotate(152deg)
                scaleX(0);
        }


        .blood.active .diagonal-br {

            transform:
                rotate(152deg)
                scaleX(1);
        }



        /* ==========================================
           SMALL OUTER SPLASH POINTS
           
           These aren't floating circles in the
           middle — they sit on the extremities of
           the splat to make the silhouette rougher.
        ========================================== */

        .splat-point {

            position: absolute;

            background: var(--blood);

            border-radius: 50%;

            opacity: 0;

            transform: scale(0);

            transition:
                transform
                0.45s
                cubic-bezier(.1, 1.3, .2, 1),

                opacity
                0.1s ease;
        }


        .blood.active .splat-point {

            opacity: 1;

            transform: scale(1);
        }


        .point-1 {

            width: 32px;
            height: 32px;

            left: 7%;
            top: 20%;

            transition-delay: 0.08s;
        }


        .point-2 {

            width: 22px;
            height: 22px;

            left: 18%;
            top: 9%;

            transition-delay: 0.14s;
        }


        .point-3 {

            width: 30px;
            height: 30px;

            right: 8%;
            top: 19%;

            transition-delay: 0.1s;
        }


        .point-4 {

            width: 20px;
            height: 20px;

            right: 18%;
            top: 9%;

            transition-delay: 0.16s;
        }


        .point-5 {

            width: 27px;
            height: 27px;

            left: 9%;
            bottom: 18%;

            transition-delay: 0.12s;
        }


        .point-6 {

            width: 20px;
            height: 20px;

            right: 10%;
            bottom: 17%;

            transition-delay: 0.18s;
        }



        /* ==========================================
           BLOOD DISAPPEARS
        ========================================== */

        .blood.draining {

            opacity: 0;

            transition:
                opacity
                1.8s
                ease;
        }


        .blood.draining .blood-main,
        .blood.draining .blood-arm,
        .blood.draining .blood-diagonal,
        .blood.draining .splat-point {

            opacity: 0;

            transition:
                opacity
                1.2s
                ease;
        }



        /* ==========================================
           THANK YOU MESSAGE
        ========================================== */

        .thanks-message {

            position: absolute;

            top:
                calc(100% + 32px);

            left: 50%;

            transform:
                translateX(-50%)
                translateY(10px);

            width: 360px;

            text-align: center;

            opacity: 0;

            z-index: 80;

            pointer-events: none;

            transition:
                opacity
                1s ease,

                transform
                1s ease;
        }


        .thanks-message.show {

            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);
        }



        /* ==========================================
           BLOOD LETTERING
        ========================================== */

        .thanks-text {

            position: relative;

            display: inline-block;

            color: var(--blood);

            font-family:
                "Nosifer",
                Georgia,
                "Times New Roman",
                serif;

            font-size: 22px;

            font-weight: 400;

            line-height: 1.4;

            letter-spacing: 0.5px;

            text-shadow:

                1px 2px 0
                #350000,

                0 3px 6px
                rgba(0, 0, 0, 0.55);
        }



        /* ==========================================
           STATIC DRIPS UNDER LETTERING
           
           Just a few irregular drips — no animation.
        ========================================== */

        .thanks-text::before {

            content: "";

            position: absolute;

            left: 12%;

            bottom: -25px;

            width: 9px;
            height: 30px;

            background: var(--blood);

            border-radius:
                0 0 50% 50%;

            box-shadow:

                48px 6px 0 -1px var(--blood),

                102px 2px 0 -2px var(--blood),

                165px 8px 0 -2px var(--blood),

                225px 2px 0 -3px var(--blood);
        }


        .thanks-text::after {

            content: "";

            position: absolute;

            right: 8%;

            bottom: -18px;

            width: 7px;
            height: 25px;

            background: var(--blood);

            border-radius:
                0 0 50% 50%;
        }



        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            .bank-container {

                width: 225px;

                top: 30%;
            }


            .share-btn {

                padding: 20px;

                font-size: 17px;
            }


            .blood-main {

                width: 560px;
                height: 470px;
            }


            .blood-arm {

                height: 60px;
            }


            .blood-diagonal {

                width: 280px;
                height: 50px;
            }


            .thanks-message {

                width: 285px;
            }


            .thanks-text {

                font-size: 17px;
            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         BLOOD SPLAT
    ========================================== -->

    <div
        class="blood"
        id="blood"
    >

        <!-- CENTRAL SPLAT -->

        <div
            class="blood-main"
        ></div>


        <!-- MAIN FOUR-SIDED PILLARS -->

        <div
            class="blood-arm arm-left"
        ></div>

        <div
            class="blood-arm arm-right"
        ></div>

        <div
            class="blood-arm arm-top"
        ></div>

        <div
            class="blood-arm arm-bottom"
        ></div>


        <!-- DIAGONAL PILLARS -->

        <div
            class="blood-diagonal diagonal-tl"
        ></div>

        <div
            class="blood-diagonal diagonal-tr"
        ></div>

        <div
            class="blood-diagonal diagonal-bl"
        ></div>

        <div
            class="blood-diagonal diagonal-br"
        ></div>


        <!-- OUTER SPLAT POINTS -->

        <div
            class="splat-point point-1"
        ></div>

        <div
            class="splat-point point-2"
        ></div>

        <div
            class="splat-point point-3"
        ></div>

        <div
            class="splat-point point-4"
        ></div>

        <div
            class="splat-point point-5"
        ></div>

        <div
            class="splat-point point-6"
        ></div>

    </div>



    <!-- ==========================================
         BUTTON
    ========================================== -->

    <div class="bank-container">

        <button
            class="share-btn"
            id="copyDetailsBtn"
            onclick="copyCombinedDetails()"
        >
            Copy Bank Details
        </button>


        <!-- THANK YOU -->

        <div
            class="thanks-message"
            id="thanksMessage"
        >

            <div class="thanks-text">

                Thanks for supporting live music :)

            </div>

        </div>

    </div>



    <script>


        /* ==========================================
           COPY BANK DETAILS
        ========================================== */

        async function copyCombinedDetails() {


            const name =
                "TAI VAN DER BAR";


            const number =
                "38-9005-0490046-02";


            const dynamicText =
                `${name}\n${number}`;


            const button =
                document.getElementById(
                    "copyDetailsBtn"
                );


            const blood =
                document.getElementById(
                    "blood"
                );


            const message =
                document.getElementById(
                    "thanksMessage"
                );


            try {


                /* ==============================
                   COPY
                ============================== */

                await navigator.clipboard.writeText(
                    dynamicText
                );


                /* ==============================
                   BUTTON
                ============================== */

                button.innerText =
                    "Copied!";


                /* ==============================
                   BLOOD EXPLOSION
                ============================== */

                blood.classList.remove(
                    "draining"
                );

                blood.classList.add(
                    "active"
                );


                /* ==============================
                   LET BLOOD SIT
                ============================== */

                setTimeout(function() {

                    blood.classList.add(
                        "draining"
                    );

                }, 3000);


                /* ==============================
                   SHOW MESSAGE
                ============================== */

                setTimeout(function() {

                    message.classList.add(
                        "show"
                    );

                }, 4400);


                /* ==============================
                   RESET BUTTON
                ============================== */

                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                }, 5000);

            }


            catch (err) {


                console.error(
                    "Could not copy details:",
                    err
                );


                button.innerText =
                    "Copy Failed";


                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                }, 2500);

            }

        }

    </script>


</body>

</html>
