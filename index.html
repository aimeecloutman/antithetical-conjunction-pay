<!DOCTYPE html>
<html lang="en-NZ">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Antithetical Conjunction - Payment Details</title>


    <!-- ==========================================
         NOSIFER FONT
    ========================================== -->

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Nosifer&display=swap"
        rel="stylesheet"
    >


    <style>

        /* ==========================================
           PAGE
        ========================================== */

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;
        }


        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            background-image:
                url("image-1024.jpg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            min-height: 100vh;

            overflow: hidden;

            position: relative;
        }



        /* ==========================================
           BLOOD COLOUR
        ========================================== */

        :root {

            --blood:
                #850000;
        }



        /* ==========================================
           BUTTON CONTAINER
        ========================================== */

        .bank-container {

            position: absolute;

            top: 40%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 240px;

            z-index: 100;
        }



        /* ==========================================
           BUTTON
        ========================================== */

        .share-btn {

            width: 100%;

            padding: 24px;

            background: #ffffff;

            color: #000000;

            border: none;

            border-radius: 8px;

            font-size: 19px;

            font-weight: 700;

            letter-spacing: 0.2px;

            cursor: pointer;

            box-shadow:
                0 5px 18px
                rgba(0, 0, 0, 0.5);

            position: relative;

            z-index: 100;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }


        .share-btn:hover {

            background: #eeeeee;
        }


        .share-btn:active {

            transform:
                scale(0.97);
        }


        .share-btn.copied {

            color:
                var(--blood);
        }



        /* ==========================================
           BLOOD CONTAINER
           
           IMPORTANT:
           
           Blood is ABOVE the button.
           
           This means the splat physically covers
           the button during the explosion.
        ========================================== */

        .blood {

            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            pointer-events: none;

            /*
                Higher than the button.
            */

            z-index: 300;

            opacity: 0;

            transition:
                opacity
                0.1s ease;
        }


        .blood.active {

            opacity: 1;
        }



        /* ==========================================
           GIANT SPLAT
        ========================================== */

        .blood-splat {

            position: absolute;

            left: 50%;
            top: 40%;

            /*
                Huge desktop size.
            */

            width: 1600px;

            height: 1200px;

            transform:
                translate(-50%, -50%)
                scale(0);

            transform-origin:
                center;

            opacity: 0;

            filter:
                drop-shadow(
                    0 10px 15px
                    rgba(0, 0, 0, 0.25)
                );

            transition:

                transform
                0.8s
                cubic-bezier(.08, 1.35, .18, 1),

                opacity
                0.1s ease;
        }


        .blood.active .blood-splat {

            transform:
                translate(-50%, -50%)
                scale(1);

            opacity: 1;
        }


        .blood-shape {

            fill:
                var(--blood);
        }



        /* ==========================================
           OUTER SPLASH DOTS
        ========================================== */

        .blood-dot {

            position: absolute;

            background:
                var(--blood);

            border-radius: 50%;

            opacity: 0;

            transform:
                scale(0);

            transition:

                transform
                0.55s
                cubic-bezier(.1, 1.3, .2, 1),

                opacity
                0.12s ease;
        }


        .blood.active .blood-dot {

            opacity: 1;

            transform:
                scale(1);
        }


        .dot-1 {

            left: 2%;
            top: 12%;

            width: 48px;
            height: 48px;

            transition-delay:
                0.04s;
        }


        .dot-2 {

            left: 10%;
            top: 4%;

            width: 25px;
            height: 25px;

            transition-delay:
                0.08s;
        }


        .dot-3 {

            left: 1%;
            top: 67%;

            width: 38px;
            height: 38px;

            transition-delay:
                0.12s;
        }


        .dot-4 {

            left: 14%;
            bottom: 4%;

            width: 45px;
            height: 45px;

            transition-delay:
                0.10s;
        }


        .dot-5 {

            right: 2%;
            top: 10%;

            width: 52px;
            height: 52px;

            transition-delay:
                0.07s;
        }


        .dot-6 {

            right: 11%;
            top: 3%;

            width: 27px;
            height: 27px;

            transition-delay:
                0.14s;
        }


        .dot-7 {

            right: 1%;
            top: 66%;

            width: 40px;
            height: 40px;

            transition-delay:
                0.16s;
        }


        .dot-8 {

            right: 13%;
            bottom: 4%;

            width: 47px;
            height: 47px;

            transition-delay:
                0.11s;
        }


        .dot-9 {

            left: 27%;
            top: 1%;

            width: 16px;
            height: 16px;

            transition-delay:
                0.18s;
        }


        .dot-10 {

            right: 27%;
            top: 2%;

            width: 19px;
            height: 19px;

            transition-delay:
                0.21s;
        }



        /* ==========================================
           BLOOD FADE
           
           The splat stays enormous while it fades.
           It does NOT shrink back into the centre.
        ========================================== */

        .blood.draining {

            opacity: 0;

            transition:
                opacity
                1.5s
                ease;
        }


        .blood.draining
        .blood-splat {

            transform:
                translate(-50%, -50%)
                scale(1);

            opacity: 0;

            transition:

                opacity
                1.5s
                ease;
        }


        .blood.draining
        .blood-dot {

            transform:
                scale(1);

            opacity: 0;

            transition:

                opacity
                1s
                ease;
        }

        .thanks-message {

            position: absolute;

            top:
                calc(100% + 32px);

            left: 50%;

            transform:
                translateX(-50%)
                translateY(15px);

            width: 370px;

            text-align: center;

            opacity: 0;

            z-index: 80;

            pointer-events: none;

            transition:

                opacity
                0.8s ease,

                transform
                0.8s ease;
        }


        .thanks-message.show {

            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);
        }



        /* ==========================================
           NOSIFER TEXT
        ========================================== */

        .thanks-text {

            position: relative;

            display: inline-block;

            color:
                var(--blood);

            font-family:
                "Nosifer",
                cursive;

            font-size:
                25px;

            line-height:
                1.4;

            letter-spacing:
                0.5px;

            text-shadow:

                1px 2px 0
                rgba(40, 0, 0, 0.8),

                0 3px 6px
                rgba(0, 0, 0, 0.4);
        }



        /* ==========================================
           MOBILE
        ========================================== */

@media (max-width: 600px) {
    .bank-container {
        width: 225px;
        top: 30%;
    }
    .share-btn {
        padding: 20px;
        font-size: 17px;
    }
    .blood-splat {
        width: 1900px;
        height: 1550px;
        left: 50%;
        top: 50%;
    }
    .thanks-message {
        width: 290px;
    }

    .thanks-text {
        font-size: 20px;
        line-height: 1.5;
    }
}

    </style>
</head>
<body>


    <!-- ==========================================
         BLOOD SPLAT
    ========================================== -->

        class="blood"
        id="blood"
    >


        <svg

            viewBox="0 0 1000 760"
            xmlns="http://www.w3.org/2000/svg"
        >

            <!--

                Thin arms start at the centre and
                gradually balloon outward into large
                rounded ends.
            -->

            <path
                class="blood-shape"

                C 511 247 505 245 500 255

                Z
                "
            />

        </svg>



        <!-- ==========================================
             OUTER SPLASH DOTS
        ========================================== -->

        <div class="blood-dot dot-1"></div>
        <div class="blood-dot dot-2"></div>
        <div class="blood-dot dot-3"></div>
        <div class="blood-dot dot-4"></div>
        <div class="blood-dot dot-5"></div>
        <div class="blood-dot dot-6"></div>
        <div class="blood-dot dot-7"></div>
        <div class="blood-dot dot-8"></div>
        <div class="blood-dot dot-9"></div>
        <div class="blood-dot dot-10"></div>


    </div>



    <!-- ==========================================
         BUTTON
    ========================================== -->

    <div class="bank-container">


        <button
            class="share-btn"
            id="copyDetailsBtn"
            onclick="copyCombinedDetails()"
        >

            Copy Bank Details

        </button>


        <!-- ======================================
             THANK YOU
        ====================================== -->

        <div
            class="thanks-message"
            id="thanksMessage"
        >

            <div class="thanks-text">

                Thanks for supporting live music :)

            </div>

        </div>


    </div>



    <script>


        /* ==========================================
           COPY BANK DETAILS
        ========================================== */

        async function copyCombinedDetails() {


            const name =
                "TAI VAN DER BAR";


            const number =
                "38-9005-0490046-02";


            const dynamicText =
                `${name}\n${number}`;


            const button =
                document.getElementById(
                    "copyDetailsBtn"
                );


            const blood =
                document.getElementById(
                    "blood"
                );


            const message =
                document.getElementById(
                    "thanksMessage"
                );


            try {


                /* ==================================
                   COPY
                ================================== */

                await navigator.clipboard.writeText(
                    dynamicText
                );


                /* ==================================
                   BUTTON CHANGES IMMEDIATELY
                ================================== */

                button.innerText =
                    "Copied!";

                button.classList.add(
                    "copied"
                );


                /* ==================================
                   RESET BLOOD
                ================================== */

                blood.classList.remove(
                    "draining"
                );

                blood.classList.remove(
                    "active"
                );


                message.classList.remove(
                    "show"
                );


                /*
                    Force the browser to recognise
                    the reset before replaying.
                */

                void blood.offsetWidth;


                /* ==================================
                   EXPLODE
                ================================== */

                blood.classList.add(
                    "active"
                );


                /* ==================================
                   HOLD FULL SCREEN
                ================================== */

                setTimeout(function() {

                    blood.classList.add(
                        "draining"
                    );

                }, 2800);


                /* ==================================
                   REVEAL TEXT
                   
                   Blood starts fading at 2.8s.
                   It takes 1.5s to disappear.
                   Text appears just after.
                ================================== */

                setTimeout(function() {

                    message.classList.add(
                        "show"
                    );

                }, 4100);


                /* ==================================
                   RESET BUTTON
                ================================== */

                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                    button.classList.remove(
                        "copied"
                    );

                }, 5500);

            }


            catch (err) {


                console.error(
                    "Could not copy details:",
                    err
                );


                button.innerText =
                    "Copy Failed";


                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                }, 2500);

            }

        }

    </script>


</body>

</html>
