<!DOCTYPE html>
<html lang="en-NZ">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Antithetical Conjunction - Payment Details</title>

    <style>

        /* =================================
           PAGE / BACKGROUND
        ================================= */

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            background-image: url("image-1024.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            min-height: 100vh;

            position: relative;

            overflow: hidden;
        }


        /* =================================
           BUTTON CONTAINER
        ================================= */

        .bank-container {

            position: absolute;

            top: 40%;

            left: 50%;

            transform: translate(-50%, -50%);

            width: 240px;

            z-index: 20;
        }


        /* =================================
           COPY BUTTON
        ================================= */

        .share-btn {

            width: 100%;

            padding: 24px;

            background: #ffffff;

            color: #000000;

            border: none;

            border-radius: 8px;

            font-size: 19px;

            font-weight: 700;

            letter-spacing: 0.2px;

            cursor: pointer;

            box-shadow:
                0 5px 18px rgba(0, 0, 0, 0.5);

            transition:
                background 0.2s ease,
                transform 0.1s ease;

            position: relative;

            z-index: 30;
        }


        .share-btn:hover {

            background: #eeeeee;
        }


        .share-btn:active {

            transform: scale(0.97);
        }


        /* =================================
           MESSAGE UNDER BUTTON
        ================================= */

        .thanks-message {

            position: absolute;

            top: calc(100% + 20px);

            left: 50%;

            transform:
                translateX(-50%)
                translateY(10px);

            width: 300px;

            text-align: center;

            color: white;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 18px;

            font-weight: 700;

            text-shadow:
                2px 2px 5px #000000;

            opacity: 0;

            z-index: 10;

            transition:
                opacity 1.2s ease,
                transform 1.2s ease;
        }


        .thanks-message.revealed {

            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);
        }


        /* =================================
           MASSIVE BLOOD SPLATTER
        ================================= */

        .blood-layer {

            position: fixed;

            inset: 0;

            z-index: 15;

            pointer-events: none;

            opacity: 0;

            transform: scale(0.2);

            transition:
                opacity 0.15s ease,
                transform 0.45s
                cubic-bezier(.1,.8,.2,1);

            background:

                radial-gradient(
                    ellipse at 50% 40%,
                    #750000 0%,
                    #8f0000 8%,
                    transparent 18%
                ),

                radial-gradient(
                    circle at 20% 25%,
                    #8f0000 0%,
                    #8f0000 7%,
                    transparent 8%
                ),

                radial-gradient(
                    circle at 80% 20%,
                    #700000 0%,
                    #700000 9%,
                    transparent 10%
                ),

                radial-gradient(
                    ellipse at 15% 75%,
                    #850000 0%,
                    #850000 8%,
                    transparent 9%
                ),

                radial-gradient(
                    ellipse at 85% 70%,
                    #700000 0%,
                    #700000 10%,
                    transparent 11%
                );
        }


        /* =================================
           BLOOD EXPLOSION
        ================================= */

        .blood-layer.explode {

            opacity: 1;

            transform: scale(1);
        }


        /* =================================
           BLOOD DROPLETS
        ================================= */

        .blood-drop {

            position: fixed;

            width: 20px;

            height: 20px;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #c00000,
                    #760000 55%,
                    #3d0000
                );

            border-radius: 50% 45% 55% 40%;

            pointer-events: none;

            z-index: 16;

            opacity: 0;

            box-shadow:
                0 2px 5px
                rgba(0, 0, 0, 0.5);
        }


        .blood-drop.fly {

            animation:
                bloodFly 0.8s
                cubic-bezier(.1,.7,.2,1)
                forwards;
        }


        @keyframes bloodFly {

            0% {

                opacity: 1;

                transform:
                    translate(0, 0)
                    scale(0.2)
                    rotate(0deg);
            }

            20% {

                opacity: 1;
            }

            100% {

                opacity: 1;

                transform:
                    translate(
                        var(--x),
                        var(--y)
                    )
                    scale(var(--scale))
                    rotate(var(--rotation));
            }
        }


        /* =================================
           LARGE BLOOD STREAKS
        ================================= */

        .blood-streak {

            position: fixed;

            width: 8px;

            height: 120px;

            background:
                linear-gradient(
                    to bottom,
                    #8f0000,
                    #720000 60%,
                    transparent
                );

            border-radius:
                50% 50% 40% 40%;

            pointer-events: none;

            z-index: 17;

            transform-origin: top;

            opacity: 0;

            animation:
                streakAppear 0.6s ease-out
                forwards;
        }


        @keyframes streakAppear {

            0% {

                opacity: 0;

                transform:
                    scaleY(0);
            }

            40% {

                opacity: 1;
            }

            100% {

                opacity: 1;

                transform:
                    scaleY(1);
            }
        }


        /* =================================
           BLOOD DRIPPING AWAY
        ================================= */

        .blood-layer.drip-away {

            animation:
                bloodDisappear 3.5s
                ease-in forwards;
        }


        @keyframes bloodDisappear {

            0% {

                opacity: 1;

                transform:
                    scale(1);
            }

            35% {

                opacity: 1;
            }

            100% {

                opacity: 0;

                transform:
                    scale(1.03)
                    translateY(30px);
            }
        }


        /* =================================
           COPIED BUTTON
        ================================= */

        .share-btn.copied {

            background: #ffffff;

            color: #000000;
        }


        /* =================================
           PHONE
        ================================= */

        @media (max-width: 600px) {

            .bank-container {

                width: 225px;

                top: 30%;
            }

            .share-btn {

                padding: 20px;

                font-size: 17px;
            }

            .thanks-message {

                width: 260px;

                font-size: 16px;
            }
        }

    </style>

</head>


<body>


    <!-- =================================
         BLOOD EFFECT
    ================================= -->

    <div
        class="blood-layer"
        id="bloodLayer"
    ></div>


    <!-- =================================
         BUTTON + MESSAGE
    ================================= -->

    <div class="bank-container">


        <button
            class="share-btn"
            id="copyDetailsBtn"
            onclick="copyCombinedDetails()"
        >
            Copy Bank Details
        </button>


        <div
            class="thanks-message"
            id="thanksMessage"
        >
            Thanks for supporting live music :)
        </div>


    </div>


    <script>


        /* =================================
           COPY BANK DETAILS
        ================================= */

        async function copyCombinedDetails() {


            const name =
                "TAI VAN DER BAR";


            const number =
                "38-9005-0490046-02";


            const dynamicText =
                `${name}\n${number}`;


            const button =
                document.getElementById(
                    "copyDetailsBtn"
                );


            const bloodLayer =
                document.getElementById(
                    "bloodLayer"
                );


            const thanksMessage =
                document.getElementById(
                    "thanksMessage"
                );


            try {


                /* =========================
                   COPY DETAILS
                ========================= */

                await navigator.clipboard.writeText(
                    dynamicText
                );


                /* =========================
                   BUTTON STAYS IN PLACE
                ========================= */

                button.innerText =
                    "Copied!";

                button.classList.add(
                    "copied"
                );


                /* =========================
                   MASSIVE BLOOD EXPLOSION
                ========================= */

                bloodLayer.classList.add(
                    "explode"
                );


                createBloodExplosion();


                /* =========================
                   WAIT FOR THE SPLATTER
                ========================= */

                setTimeout(function() {

                    bloodLayer.classList.add(
                        "drip-away"
                    );

                }, 900);


                /* =========================
                   REVEAL MESSAGE
                ========================= */

                setTimeout(function() {

                    thanksMessage.classList.add(
                        "revealed"
                    );

                }, 2800);


                /* =========================
                   RESET BUTTON TEXT
                ========================= */

                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                    button.classList.remove(
                        "copied"
                    );

                }, 4000);


            }

            catch (err) {


                console.error(
                    "Could not copy details:",
                    err
                );


                button.innerText =
                    "Copy Failed";


                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                }, 2500);

            }

        }


        /* =================================
           CREATE MASSIVE BLOOD EXPLOSION
        ================================= */

        function createBloodExplosion() {


            const button =
                document.getElementById(
                    "copyDetailsBtn"
                );


            const rect =
                button.getBoundingClientRect();


            const startX =
                rect.left +
                rect.width / 2;


            const startY =
                rect.top +
                rect.height / 2;


            /* =========================
               CREATE 90 BLOOD DROPS
            ========================= */

            for (
                let i = 0;
                i < 90;
                i++
            ) {


                const drop =
                    document.createElement(
                        "div"
                    );


                drop.className =
                    "blood-drop";


                drop.style.left =
                    startX + "px";


                drop.style.top =
                    startY + "px";


                /* Random direction */

                const angle =
                    Math.random() *
                    Math.PI *
                    2;


                /* Make some drops
                   travel VERY far */

                const distance =
                    120 +
                    Math.random() *
                    Math.max(
                        window.innerWidth,
                        window.innerHeight
                    );


                const x =
                    Math.cos(angle) *
                    distance;


                const y =
                    Math.sin(angle) *
                    distance;


                drop.style.setProperty(
                    "--x",
                    x + "px"
                );


                drop.style.setProperty(
                    "--y",
                    y + "px"
                );


                drop.style.setProperty(
                    "--scale",
                    0.4 +
                    Math.random() * 2
                );


                drop.style.setProperty(
                    "--rotation",
                    Math.random() *
                    720 +
                    "deg"
                );


                /* Random size */

                const size =
                    6 +
                    Math.random() *
                    35;


                drop.style.width =
                    size + "px";


                drop.style.height =
                    size * 0.8 + "px";


                document.body.appendChild(
                    drop
                );


                /*
                    Small delay makes the
                    explosion feel organic.
                */

                setTimeout(function() {

                    drop.classList.add(
                        "fly"
                    );

                }, Math.random() * 180);


                /*
                    Remove afterwards
                */

                setTimeout(function() {

                    drop.remove();

                }, 5000);

            }


            /* =========================
               CREATE LONG BLOOD STREAKS
            ========================= */

            for (
                let i = 0;
                i < 18;
                i++
            ) {


                const streak =
                    document.createElement(
                        "div"
                    );


                streak.className =
                    "blood-streak";


                /*
                    Spread streaks around
                    the whole screen.
                */

                streak.style.left =
                    Math.random() *
                    100 +
                    "%";


                streak.style.top =
                    Math.random() *
                    70 +
                    "%";


                streak.style.height =
                    80 +
                    Math.random() *
                    300 +
                    "px";


                streak.style.width =
                    3 +
                    Math.random() *
                    15 +
                    "px";


                streak.style.animationDelay =
                    Math.random() *
                    0.5 +
                    "s";


                document.body.appendChild(
                    streak
                );


                /*
                    Let the blood exist for
                    a few seconds before removal.
                */

                setTimeout(function() {

                    streak.style.transition =
                        "opacity 2s ease";

                    streak.style.opacity =
                        "0";

                }, 3000);


                setTimeout(function() {

                    streak.remove();

                }, 5500);

            }

        }

    </script>


</body>

</html>
