<!DOCTYPE html>
<html lang="en-NZ">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Antithetical Conjunction - Payment Details</title>

    <style>

        /* =================================
           PAGE
        ================================= */

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            background-image:
                url("image-1024.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            min-height: 100vh;

            position: relative;

            overflow: hidden;
        }


        /* =================================
           BUTTON CONTAINER
        ================================= */

        .bank-container {

            position: absolute;

            top: 40%;

            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 240px;

            z-index: 50;
        }


        /* =================================
           BUTTON
        ================================= */

        .share-btn {

            width: 100%;

            padding: 24px;

            background: #ffffff;

            color: #000000;

            border: none;

            border-radius: 8px;

            font-size: 19px;

            font-weight: 700;

            letter-spacing: 0.2px;

            cursor: pointer;

            box-shadow:
                0 5px 18px
                rgba(0, 0, 0, 0.5);

            position: relative;

            z-index: 60;
        }


        .share-btn:hover {

            background: #eeeeee;
        }


        .share-btn:active {

            transform:
                scale(0.97);
        }


        /* =================================
           THANK YOU MESSAGE
        ================================= */

        .thanks-message {

            position: absolute;

            top: calc(100% + 30px);

            left: 50%;

            transform:
                translateX(-50%);

            width: 360px;

            text-align: center;

            opacity: 0;

            z-index: 40;

            pointer-events: none;

            transition:
                opacity 1.5s ease;
        }


        .thanks-message.revealed {

            opacity: 1;
        }


        /* =================================
           BLOODY TEXT
        ================================= */

        .blood-writing {

            color: #750000;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 25px;

            font-weight: 900;

            line-height: 1.15;

            letter-spacing: 1px;

            text-transform: none;

            text-shadow:
                1px 2px 0 #3b0000,
                0 3px 5px
                rgba(0, 0, 0, 0.8);

            position: relative;
        }


        /*
            Little blood drips hanging
            from the lettering.
        */

        .blood-writing::after {

            content: "";

            position: absolute;

            left: 22%;

            bottom: -18px;

            width: 9px;

            height: 25px;

            background:
                linear-gradient(
                    to bottom,
                    #750000,
                    #520000
                );

            border-radius:
                0 0 50% 50%;
        }


        /* =================================
           HUGE BLOOD SPLAT
        ================================= */

        .blood-splat {

            position: fixed;

            left: 50%;

            top: 40%;

            width: 0;

            height: 0;

            z-index: 30;

            pointer-events: none;
        }


        /*
            Main giant irregular blob
        */

        .blood-splat::before {

            content: "";

            position: absolute;

            width: 650px;

            height: 520px;

            left: -325px;

            top: -260px;

            background:

                radial-gradient(
                    ellipse at 48% 45%,
                    #a40000 0%,
                    #8b0000 45%,
                    #680000 75%,
                    #4b0000 100%
                );

            border-radius:
                47% 53% 42% 58%
                /
                55% 43% 57% 45%;

            box-shadow:

                0 15px 25px
                rgba(0, 0, 0, 0.35);

            transform:
                scale(0);

            opacity: 0;

            transition:
                transform 0.35s
                cubic-bezier(.1,.8,.2,1),
                opacity 0.25s ease;
        }


        /* =================================
           SPLAT EXPLOSION
        ================================= */

        .blood-splat.explode::before {

            transform:
                scale(1);

            opacity: 1;
        }


        /* =================================
           BLOOD ARMS / SPLASHES
        ================================= */

        .splat-arm {

            position: fixed;

            width: 240px;

            height: 90px;

            background:
                #820000;

            z-index: 31;

            pointer-events: none;

            opacity: 0;

            transform-origin:
                center;

            border-radius:
                70% 30% 60% 40%;
        }


        .splat-arm.one {

            left: 4%;

            top: 38%;

            transform:
                rotate(-18deg)
                scale(0);

        }


        .splat-arm.two {

            right: 2%;

            top: 30%;

            transform:
                rotate(20deg)
                scale(0);

        }


        .splat-arm.three {

            left: 15%;

            top: 15%;

            width: 180px;

            height: 70px;

            transform:
                rotate(25deg)
                scale(0);

        }


        .splat-arm.four {

            right: 12%;

            top: 62%;

            width: 210px;

            height: 80px;

            transform:
                rotate(-25deg)
                scale(0);

        }


        .blood-splat.explode
        ~ .splat-arm {

            opacity: 1;

            animation:
                armExplosion
                0.45s
                cubic-bezier(.1,.8,.2,1)
                forwards;
        }


        @keyframes armExplosion {

            0% {

                transform:
                    scale(0);
            }

            100% {

                transform:
                    scale(1);
            }
        }


        /* =================================
           THICK BLOOD DRIPS
        ================================= */

        .drip {

            position: fixed;

            z-index: 32;

            background:
                linear-gradient(
                    to bottom,
                    #8b0000,
                    #650000
                );

            border-radius:
                0 0 50% 50%;

            pointer-events: none;

            transform-origin: top;

            transform:
                scaleY(0);

            opacity: 0;
        }


        .drip.one {

            left: 34%;

            top: 55%;

            width: 28px;

            height: 230px;
        }


        .drip.two {

            left: 43%;

            top: 58%;

            width: 16px;

            height: 160px;
        }


        .drip.three {

            left: 51%;

            top: 57%;

            width: 35px;

            height: 300px;
        }


        .drip.four {

            left: 61%;

            top: 54%;

            width: 19px;

            height: 190px;
        }


        .drip.five {

            left: 70%;

            top: 50%;

            width: 27px;

            height: 250px;
        }


        .blood-splat.explode
        ~ .drip {

            opacity: 1;

            animation:
                dripDown
                2s
                ease-out
                forwards;
        }


        @keyframes dripDown {

            0% {

                transform:
                    scaleY(0);

                opacity: 0;
            }

            20% {

                opacity: 1;
            }

            100% {

                transform:
                    scaleY(1);

                opacity: 1;
            }
        }


        /* =================================
           BLOOD DISAPPEARS
        ================================= */

        .blood-splat.fade {

            animation:
                bloodFade
                3s
                ease-in
                forwards;
        }


        .blood-splat.fade::before {

            animation:
                mainBloodFade
                3s
                ease-in
                forwards;
        }


        @keyframes bloodFade {

            from {

                opacity: 1;
            }

            to {

                opacity: 0;
            }
        }


        @keyframes mainBloodFade {

            0% {

                opacity: 1;

                transform:
                    scale(1);
            }

            60% {

                opacity: 0.8;

                transform:
                    scale(1.02)
                    translateY(20px);
            }

            100% {

                opacity: 0;

                transform:
                    scale(1.05)
                    translateY(60px);
            }
        }


        /* =================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            .bank-container {

                width: 225px;

                top: 30%;
            }


            .share-btn {

                padding: 20px;

                font-size: 17px;
            }


            .blood-splat::before {

                width: 430px;

                height: 420px;

                left: -215px;

                top: -210px;
            }


            .thanks-message {

                width: 280px;

                top:
                    calc(100% + 25px);
            }


            .blood-writing {

                font-size: 21px;
            }


            .splat-arm {

                display: none;
            }


            .drip.one {

                left: 25%;
            }

            .drip.two {

                left: 38%;
            }

            .drip.three {

                left: 50%;
            }

            .drip.four {

                left: 63%;
            }

            .drip.five {

                left: 75%;
            }
        }

    </style>

</head>


<body>


    <!-- =================================
         HUGE BLOOD SPLAT
    ================================= -->

    <div
        class="blood-splat"
        id="bloodSplat"
    ></div>


    <!-- =================================
         BLOOD SPLASH ARMS
    ================================= -->

    <div class="splat-arm one"></div>
    <div class="splat-arm two"></div>
    <div class="splat-arm three"></div>
    <div class="splat-arm four"></div>


    <!-- =================================
         THICK DRIPS
    ================================= -->

    <div class="drip one"></div>
    <div class="drip two"></div>
    <div class="drip three"></div>
    <div class="drip four"></div>
    <div class="drip five"></div>


    <!-- =================================
         BUTTON
    ================================= -->

    <div class="bank-container">

        <button
            class="share-btn"
            id="copyDetailsBtn"
            onclick="copyCombinedDetails()"
        >
            Copy Bank Details
        </button>


        <!-- =================================
             MESSAGE
        ================================= -->

        <div
            class="thanks-message"
            id="thanksMessage"
        >

            <div class="blood-writing">
                Thanks for supporting live music :)
            </div>

        </div>

    </div>


    <script>


        /* =================================
           COPY BANK DETAILS
        ================================= */

        async function copyCombinedDetails() {


            const name =
                "TAI VAN DER BAR";


            const number =
                "38-9005-0490046-02";


            const dynamicText =
                `${name}\n${number}`;


            const button =
                document.getElementById(
                    "copyDetailsBtn"
                );


            const bloodSplat =
                document.getElementById(
                    "bloodSplat"
                );


            const thanksMessage =
                document.getElementById(
                    "thanksMessage"
                );


            try {


                /* =========================
                   COPY
                ========================= */

                await navigator.clipboard.writeText(
                    dynamicText
                );


                /* =========================
                   BUTTON DOES NOT MOVE
                ========================= */

                button.innerText =
                    "Copied!";


                /* =========================
                   BIG BLOOD SPLAT
                ========================= */

                bloodSplat.classList.add(
                    "explode"
                );


                /* =========================
                   WAIT FOR BIG SPLAT
                ========================= */

                setTimeout(function() {

                    /*
                        Start the blood
                        disappearing.
                    */

                    bloodSplat.classList.add(
                        "fade"
                    );


                    /*
                        Reveal message.
                    */

                    thanksMessage.classList.add(
                        "revealed"
                    );

                }, 3000);


                /* =========================
                   RESET BUTTON
                ========================= */

                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                }, 4500);

            }


            catch (err) {

                console.error(
                    "Could not copy details:",
                    err
                );


                button.innerText =
                    "Copy Failed";


                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                }, 2500);

            }

        }

    </script>


</body>

</html>
