<!DOCTYPE html>
<html lang="en-NZ">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Antithetical Conjunction - Payment Details</title>


    <!-- ==========================================
         CARTOON FONT
    ========================================== -->

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bangers&display=swap"
        rel="stylesheet"
    >


    <style>

        /* ==========================================
           PAGE
        ========================================== */

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;
        }


        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            background-image:
                url("image-1024.jpg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            min-height: 100vh;

            overflow: hidden;

            position: relative;
        }



        /* ==========================================
           BLOOD COLOUR
        ========================================== */

        :root {

            --blood:
                #850000;
        }



        /* ==========================================
           BUTTON
        ========================================== */

        .bank-container {

            position: absolute;

            top: 40%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 240px;

            z-index: 100;
        }


        .share-btn {

            width: 100%;

            padding: 24px;

            background: #ffffff;

            color: #000000;

            border: none;

            border-radius: 8px;

            font-size: 19px;

            font-weight: 700;

            letter-spacing: 0.2px;

            cursor: pointer;

            box-shadow:
                0 5px 18px
                rgba(0, 0, 0, 0.5);

            position: relative;

            z-index: 200;
        }


        .share-btn:hover {

            background: #eeeeee;
        }


        .share-btn:active {

            transform:
                scale(0.97);
        }



        /* ==========================================
           BLOOD CONTAINER
        ========================================== */

        .blood {

            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            pointer-events: none;

            z-index: 50;

            opacity: 0;
        }


        .blood.active {

            opacity: 1;
        }



        /* ==========================================
           CARTOON SPLAT
           
           The splat is deliberately built from:
           
           - rounded central body
           - thin arms
           - bulbous tips
           - irregular asymmetry
           - no hanging drips
        ========================================== */

        .blood-splat {

            position: absolute;

            left: 50%;
            top: 40%;

            width: min(900px, 105vw);

            height: min(700px, 85vh);

            transform:
                translate(-50%, -50%)
                scale(0);

            transform-origin:
                center;

            opacity: 0;

            filter:
                drop-shadow(
                    0 8px 12px
                    rgba(0, 0, 0, 0.25)
                );

            transition:

                transform
                0.65s
                cubic-bezier(.12, 1.25, .25, 1),

                opacity
                0.12s ease;
        }


        .blood.active .blood-splat {

            transform:
                translate(-50%, -50%)
                scale(1);

            opacity: 1;
        }


        .blood-shape {

            fill:
                var(--blood);
        }



        /* ==========================================
           OUTER SPLASH DOTS
        ========================================== */

        .blood-dot {

            position: absolute;

            width: 24px;
            height: 24px;

            background:
                var(--blood);

            border-radius: 50%;

            opacity: 0;

            transform:
                scale(0);

            transition:

                transform
                0.45s
                cubic-bezier(.1, 1.3, .2, 1),

                opacity
                0.1s ease;
        }


        .blood.active .blood-dot {

            opacity: 1;

            transform:
                scale(1);
        }


        .dot-1 {

            left: 10%;
            top: 21%;

            width: 28px;
            height: 28px;
        }


        .dot-2 {

            left: 17%;
            top: 13%;

            width: 15px;
            height: 15px;

            transition-delay:
                0.08s;
        }


        .dot-3 {

            right: 10%;
            top: 18%;

            width: 25px;
            height: 25px;

            transition-delay:
                0.12s;
        }


        .dot-4 {

            right: 18%;
            top: 10%;

            width: 14px;
            height: 14px;

            transition-delay:
                0.16s;
        }


        .dot-5 {

            left: 12%;
            bottom: 18%;

            width: 20px;
            height: 20px;

            transition-delay:
                0.1s;
        }


        .dot-6 {

            right: 13%;
            bottom: 20%;

            width: 18px;
            height: 18px;

            transition-delay:
                0.15s;
        }



        /* ==========================================
           DRAINING
        ========================================== */

        .blood.draining {

            opacity: 0;

            transition:
                opacity
                1.5s
                ease;
        }


        .blood.draining
        .blood-splat {

            transform:
                translate(-50%, -50%)
                scale(0.95);

            opacity: 0;

            transition:

                transform
                1.2s
                ease-in,

                opacity
                1.2s
                ease;
        }


        .blood.draining
        .blood-dot {

            transform:
                scale(0);

            opacity: 0;

            transition:

                transform
                0.7s
                ease-in,

                opacity
                0.7s
                ease;
        }



        /* ==========================================
           THANK YOU MESSAGE
        ========================================== */

        .thanks-message {

            position: absolute;

            top:
                calc(100% + 32px);

            left: 50%;

            transform:
                translateX(-50%)
                translateY(10px);

            width: 370px;

            text-align: center;

            opacity: 0;

            z-index: 80;

            pointer-events: none;

            transition:

                opacity
                1s ease,

                transform
                1s ease;
        }


        .thanks-message.show {

            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);
        }



        /* ==========================================
           CARTOON THANK-YOU FONT
        ========================================== */

        .thanks-text {

            position: relative;

            display: inline-block;

            color:
                var(--blood);

            font-family:
                "Bangers",
                cursive;

            font-size:
                29px;

            line-height:
                1.2;

            letter-spacing:
                1px;

            text-shadow:

                2px 3px 0
                rgba(40, 0, 0, 0.85),

                0 4px 7px
                rgba(0, 0, 0, 0.35);

            /* Slight cartoon tilt */
            transform:
                rotate(-1deg);
        }


        /*
            IMPORTANT:
            
            No ::before
            No ::after
            
            This removes the static drips which previously
            remained underneath the message after the blood
            splat disappeared.
        */



        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            .bank-container {

                width: 225px;

                top: 30%;
            }


            .share-btn {

                padding: 20px;

                font-size: 17px;
            }


            .blood-splat {

                width: 850px;

                height: 650px;
            }


            .thanks-message {

                width: 290px;
            }


            .thanks-text {

                font-size: 24px;

                letter-spacing:
                    0.8px;
            }

        }

    </style>

</head>

        ========================================== -->

        <div class="blood-dot dot-2"></div>

        <div class="blood-dot dot-4"></div>

    </div>



    <!-- ==========================================
         BUTTON
    ========================================== -->

    <div class="bank-container">


        <button
            class="share-btn"
            id="copyDetailsBtn"
            onclick="copyCombinedDetails()"
        >

            Copy Bank Details

        </button>


        <!-- THANK YOU -->

        <div
            class="thanks-message"
            id="thanksMessage"
        >

            <div class="thanks-text">

                Thanks for supporting live music :)

            </div>

        </div>


    </div>



    <script>


        /* ==========================================
           COPY BANK DETAILS
        ========================================== */

        async function copyCombinedDetails() {


            const name =
                "TAI VAN DER BAR";


            const number =
                "38-9005-0490046-02";


            const dynamicText =
                `${name}\n${number}`;


            const button =
                document.getElementById(
                    "copyDetailsBtn"
                );


            const blood =
                document.getElementById(
                    "blood"
                );


            const message =
                document.getElementById(
                    "thanksMessage"
                );


            try {


                /* ==============================
                   COPY
                ============================== */

                await navigator.clipboard.writeText(
                    dynamicText
                );


                /* ==============================
                   BUTTON
                ============================== */

                button.innerText =
                    "Copied!";


                /* ==============================
                   BLOOD SPLAT
                ============================== */

                blood.classList.remove(
                    "draining"
                );

                blood.classList.add(
                    "active"
                );


                /* ==============================
                   BLOOD STAYS
                ============================== */

                setTimeout(function() {

                    blood.classList.add(
                        "draining"
                    );

                }, 3000);


                /* ==============================
                   THANK YOU
                ============================== */

                setTimeout(function() {

                    message.classList.add(
                        "show"
                    );

                }, 4400);


                /* ==============================
                   RESET BUTTON
                ============================== */

                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                }, 5000);

            }


            catch (err) {


                console.error(
                    "Could not copy details:",
                    err
                );


                button.innerText =
                    "Copy Failed";


                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                }, 2500);

            }

        }


    </script>
