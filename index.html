<!DOCTYPE html>
<html lang="en-NZ">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Antithetical Conjunction - Payment Details</title>

    <style>


        /* ==========================================
           PAGE
        ========================================== */

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;
        }


        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            background-image:
                url("image-1024.jpg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            min-height: 100vh;

            overflow: hidden;

            position: relative;
        }



        /* ==========================================
           BUTTON CONTAINER
        ========================================== */

        .bank-container {

            position: absolute;

            top: 40%;

            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 240px;

            z-index: 100;
        }



        /* ==========================================
           BUTTON
        ========================================== */

        .share-btn {

            width: 100%;

            padding: 24px;

            background: white;

            color: black;

            border: none;

            border-radius: 8px;

            font-size: 19px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 5px 18px
                rgba(0, 0, 0, 0.5);

            position: relative;

            z-index: 200;

            transition:
                background 0.2s ease;
        }


        .share-btn:hover {

            background: #eeeeee;
        }


        .share-btn:active {

            transform: scale(0.97);
        }



        /* ==========================================
           LIQUID BLOOD CONTAINER
        ========================================== */

        .blood {

            position: fixed;

            inset: 0;

            width: 100vw;

            height: 100vh;

            z-index: 50;

            pointer-events: none;

            opacity: 0;

            transform:
                scale(0.05);

            transform-origin:
                50% 40%;

            transition:
                transform 0.65s
                cubic-bezier(.1,.8,.2,1),

                opacity 0.2s ease;
        }


        /*
            Activated after clicking.
        */

        .blood.active {

            opacity: 1;

            transform:
                scale(1);
        }



        /* ==========================================
           MAIN LIQUID SHAPE
        ========================================== */

        .blood-liquid {

            position: absolute;

            left: -5%;

            bottom: -5%;

            width: 110%;

            height: 90%;

            background:

                linear-gradient(
                    180deg,
                    #a30000 0%,
                    #850000 35%,
                    #650000 70%,
                    #430000 100%
                );

            /*
                This is the important part
                borrowed from your example.
            */

            clip-path:
                polygon(
                    0% 42%,
                    8% 39%,
                    17% 43%,
                    27% 36%,
                    38% 43%,
                    49% 34%,
                    61% 42%,
                    72% 35%,
                    83% 41%,
                    92% 34%,
                    100% 40%,

                    100% 100%,
                    0% 100%
                );

            transform:
                translateY(110%);

            transition:
                transform 0.9s
                cubic-bezier(.12,.75,.2,1);

            animation:
                bloodWave 3s
                ease-in-out
                infinite alternate;
        }


        .blood.active
        .blood-liquid {

            transform:
                translateY(0);
        }



        /* ==========================================
           LIQUID WAVE
        ========================================== */

        @keyframes bloodWave {

            0% {

                clip-path:
                    polygon(
                        0% 42%,
                        8% 39%,
                        17% 43%,
                        27% 36%,
                        38% 43%,
                        49% 34%,
                        61% 42%,
                        72% 35%,
                        83% 41%,
                        92% 34%,
                        100% 40%,

                        100% 100%,
                        0% 100%
                    );
            }


            50% {

                clip-path:
                    polygon(
                        0% 50%,
                        9% 45%,
                        18% 48%,
                        29% 42%,
                        39% 49%,
                        50% 40%,
                        62% 47%,
                        73% 39%,
                        84% 46%,
                        93% 40%,
                        100% 45%,

                        100% 100%,
                        0% 100%
                    );
            }


            100% {

                clip-path:
                    polygon(
                        0% 38%,
                        9% 43%,
                        18% 36%,
                        28% 45%,
                        39% 37%,
                        50% 45%,
                        61% 35%,
                        72% 44%,
                        84% 37%,
                        93% 43%,
                        100% 36%,

                        100% 100%,
                        0% 100%
                    );
            }
        }



        /* ==========================================
           SECOND LIQUID LAYER
        ========================================== */

        .blood-liquid-back {

            position: absolute;

            left: -10%;

            bottom: 5%;

            width: 120%;

            height: 82%;

            background:
                #570000;

            opacity: 0.7;

            clip-path:
                polygon(
                    0% 50%,
                    12% 44%,
                    23% 48%,
                    35% 40%,
                    48% 47%,
                    61% 39%,
                    74% 47%,
                    87% 41%,
                    100% 48%,

                    100% 100%,
                    0% 100%
                );

            transform:
                translateY(110%);

            transition:
                transform 1.1s
                cubic-bezier(.1,.7,.2,1);

            animation:
                backWave 4s
                ease-in-out
                infinite alternate;
        }


        .blood.active
        .blood-liquid-back {

            transform:
                translateY(0);
        }



        @keyframes backWave {

            0% {

                clip-path:
                    polygon(
                        0% 50%,
                        12% 44%,
                        23% 48%,
                        35% 40%,
                        48% 47%,
                        61% 39%,
                        74% 47%,
                        87% 41%,
                        100% 48%,

                        100% 100%,
                        0% 100%
                    );
            }


            100% {

                clip-path:
                    polygon(
                        0% 43%,
                        12% 49%,
                        23% 42%,
                        35% 50%,
                        48% 41%,
                        61% 48%,
                        74% 40%,
                        87% 49%,
                        100% 42%,

                        100% 100%,
                        0% 100%
                    );
            }
        }



        /* ==========================================
           HUGE DRIPS
        ========================================== */

        .drips {

            position: absolute;

            left: 0;

            bottom: 0;

            width: 100%;

            height: 60%;

            pointer-events: none;
        }


        .drip {

            position: absolute;

            top: 0;

            width: var(--width);

            height: var(--height);

            left: var(--left);

            background:
                linear-gradient(
                    180deg,
                    #850000,
                    #650000
                );

            border-radius:
                0 0 50% 50%;

            transform:
                scaleY(0);

            transform-origin:
                top;

            transition:
                transform
                1.4s
                cubic-bezier(.2,.8,.2,1);

            box-shadow:
                3px 4px 8px
                rgba(0,0,0,0.25);
        }


        .blood.active .drip {

            transform:
                scaleY(1);
        }



        /* ==========================================
           DRIP POSITIONS
        ========================================== */

        .drip:nth-child(1) {

            --left: 12%;

            --width: 34px;

            --height: 210px;

            transition-delay: .15s;
        }


        .drip:nth-child(2) {

            --left: 27%;

            --width: 19px;

            --height: 150px;

            transition-delay: .35s;
        }


        .drip:nth-child(3) {

            --left: 41%;

            --width: 45px;

            --height: 290px;

            transition-delay: .1s;
        }


        .drip:nth-child(4) {

            --left: 57%;

            --width: 24px;

            --height: 180px;

            transition-delay: .45s;
        }


        .drip:nth-child(5) {

            --left: 70%;

            --width: 40px;

            --height: 240px;

            transition-delay: .25s;
        }


        .drip:nth-child(6) {

            --left: 87%;

            --width: 25px;

            --height: 170px;

            transition-delay: .4s;
        }



        /* ==========================================
           BLOODY MESSAGE
        ========================================== */

        .thanks-message {

            position: absolute;

            top:
                calc(100% + 30px);

            left: 50%;

            transform:
                translateX(-50%);

            width: 330px;

            text-align: center;

            opacity: 0;

            z-index: 80;

            transition:
                opacity 1.5s ease;
        }


        .thanks-message.show {

            opacity: 1;
        }


        .thanks-text {

            color:
                #760000;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                23px;

            font-weight:
                900;

            line-height:
                1.25;

            text-shadow:

                1px 2px 0 #350000,

                0 3px 5px
                rgba(0,0,0,0.7);

            position: relative;

            display: inline-block;
        }


        /*
            Little hanging blood drops
            attached to the lettering.
        */

        .thanks-text::before {

            content:
                "";

            position: absolute;

            width: 8px;

            height: 22px;

            background:
                #760000;

            left: 19%;

            bottom: -16px;

            border-radius:
                0 0 50% 50%;
        }


        .thanks-text::after {

            content:
                "";

            position: absolute;

            width: 5px;

            height: 14px;

            background:
                #760000;

            right: 24%;

            bottom: -10px;

            border-radius:
                0 0 50% 50%;
        }



        /* ==========================================
           DRAINING EFFECT
        ========================================== */

        .blood.draining {

            animation:
                fadeBlood
                3s
                ease-in
                forwards;
        }


        @keyframes fadeBlood {

            0% {

                opacity: 1;
            }

            50% {

                opacity: 0.85;
            }

            100% {

                opacity: 0;
            }
        }



        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            .bank-container {

                width: 225px;

                top: 30%;
            }


            .share-btn {

                padding: 20px;

                font-size: 17px;
            }


            .thanks-message {

                width: 280px;
            }


            .thanks-text {

                font-size: 19px;
            }


            .blood-liquid {

                height: 85%;
            }


            .drip:nth-child(1) {

                --left: 10%;
            }


            .drip:nth-child(2) {

                --left: 25%;
            }


            .drip:nth-child(3) {

                --left: 40%;
            }


            .drip:nth-child(4) {

                --left: 55%;
            }


            .drip:nth-child(5) {

                --left: 72%;
            }


            .drip:nth-child(6) {

                --left: 88%;
            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         BLOOD EFFECT
    ========================================== -->

    <div
        class="blood"
        id="blood"
    >

        <div
            class="blood-liquid-back"
        ></div>


        <div
            class="blood-liquid"
        ></div>


        <div
            class="drips">

            <div class="drip"></div>

            <div class="drip"></div>

            <div class="drip"></div>

            <div class="drip"></div>

            <div class="drip"></div>

            <div class="drip"></div>

        </div>

    </div>



    <!-- ==========================================
         BUTTON
    ========================================== -->

    <div class="bank-container">

        <button
            class="share-btn"
            id="copyDetailsBtn"
            onclick="copyCombinedDetails()"
        >
            Copy Bank Details
        </button>


        <!-- ======================================
             MESSAGE
        ====================================== -->

        <div
            class="thanks-message"
            id="thanksMessage"
        >

            <div class="thanks-text">

                Thanks for supporting live music :)

            </div>

        </div>

    </div>



    <script>


        /* ==========================================
           COPY BANK DETAILS
        ========================================== */

        async function copyCombinedDetails() {


            const name =
                "TAI VAN DER BAR";


            const number =
                "38-9005-0490046-02";


            const dynamicText =
                `${name}\n${number}`;


            const button =
                document.getElementById(
                    "copyDetailsBtn"
                );


            const blood =
                document.getElementById(
                    "blood"
                );


            const message =
                document.getElementById(
                    "thanksMessage"
                );


            try {


                /* ==================================
                   COPY
                ================================== */

                await navigator.clipboard.writeText(
                    dynamicText
                );


                /* ==================================
                   BUTTON STAYS WHERE IT IS
                ================================== */

                button.innerText =
                    "Copied!";


                /* ==================================
                   BIG BLOOD SPLASH
                ================================== */

                blood.classList.add(
                    "active"
                );


                /* ==================================
                   WAIT FOR BLOOD
                ================================== */

                setTimeout(function() {


                    /*
                        Start draining/fading
                    */

                    blood.classList.add(
                        "draining"
                    );


                    /*
                        Reveal bloody text
                    */

                    message.classList.add(
                        "show"
                    );


                }, 3000);


                /* ==================================
                   RESET BUTTON
                ================================== */

                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                }, 4500);

            }


            catch (err) {


                console.error(
                    "Could not copy details:",
                    err
                );


                button.innerText =
                    "Copy Failed";


                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                }, 2500);

            }

        }

    </script>


</body>

</html>
