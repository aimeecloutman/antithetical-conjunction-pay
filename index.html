<!DOCTYPE html>
<html lang="en-NZ">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Antithetical Conjunction - Payment Details</title>

    <style>

        /* ================================
           PAGE / BACKGROUND
        ================================= */

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            background-image: url("image-1024.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            min-height: 100vh;

            position: relative;
        }


        /* ================================
           BUTTON POSITION
        ================================= */

        .bank-container {

            position: absolute;

            top: 40%;

            left: 50%;

            transform: translate(-50%, -50%);

            width: 240px;
        }


        /* ================================
           COPY BUTTON
        ================================= */

        .share-btn {

            width: 100%;

            padding: 24px 24px;

            background: #ffffff;

            color: #000000;

            border: none;

            border-radius: 8px;

            font-size: 19px;

            font-weight: 700;

            letter-spacing: 0.2px;

            cursor: pointer;

            box-shadow:
                0 5px 18px rgba(0, 0, 0, 0.5);

            transition:
                background 0.2s ease,
                transform 0.1s ease;
        }


        /* ================================
           HOVER
        ================================= */

        .share-btn:hover {

            background: #eeeeee;
        }


        /* ================================
           WHEN PRESSED
        ================================= */

        .share-btn:active {

            transform: scale(0.97);
        }


        /* ================================
           COPIED BUTTON
        ================================= */

        .share-btn.copied {

            background: #ffffff;

            color: #000000;
        }


        /* ================================
           COPIED MESSAGE
        ================================= */

        .copied-message {

            display: none;

            text-align: center;

            margin-top: 18px;

            animation:
                appear 0.4s ease-out forwards;
        }


        .copied-message.show {

            display: block;
        }


        /* ================================
           BLOOD TEXT
        ================================= */

        .blood-text {

            color: #8b0000;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 34px;

            font-weight: 900;

            letter-spacing: 2px;

            text-shadow:
                2px 2px 0 #300000,
                0 0 8px rgba(120, 0, 0, 0.7);

            position: relative;
        }


        /* ================================
           DRIPS
        ================================= */

        .blood-text::after {

            content: "●  ●  ●";

            display: block;

            color: #8b0000;

            font-size: 13px;

            letter-spacing: 12px;

            margin-top: -5px;
        }


        /* ================================
           THANK YOU MESSAGE
        ================================= */

        .thanks-text {

            margin-top: 8px;

            color: white;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 15px;

            font-weight: 700;

            text-shadow:
                1px 1px 3px black;
        }


        /* ================================
           BLOOD SPLATS
        ================================= */

        .blood-splat {

            position: fixed;

            width: 12px;
            height: 12px;

            background: #8b0000;

            border-radius: 50%;

            pointer-events: none;

            z-index: 100;

            animation:
                splatter 0.8s ease-out forwards;
        }


        /* ================================
           SPLATTER ANIMATION
        ================================= */

        @keyframes splatter {

            0% {

                transform:
                    translate(0, 0)
                    scale(0);

                opacity: 1;
            }

            60% {

                opacity: 1;
            }

            100% {

                transform:
                    translate(var(--x), var(--y))
                    scale(1.5);

                opacity: 0;
            }
        }


        /* ================================
           MESSAGE APPEAR
        ================================= */

        @keyframes appear {

            from {

                opacity: 0;

                transform:
                    scale(0.7);
            }

            to {

                opacity: 1;

                transform:
                    scale(1);
            }
        }


        /* ================================
           PHONE / SMALL SCREEN
        ================================= */

        @media (max-width: 600px) {

            .bank-container {

                width: 225px;

                top: 30%;
            }

            .share-btn {

                padding: 20px 20px;

                font-size: 17px;
            }

            .blood-text {

                font-size: 30px;
            }

            .thanks-text {

                font-size: 14px;
            }
        }

    </style>

</head>


<body>


    <!-- =================================
         COPY BANK DETAILS
    ================================= -->

    <div class="bank-container">

        <button
            class="share-btn"
            id="copyDetailsBtn"
            onclick="copyCombinedDetails()"
        >
            Copy Bank Details
        </button>


        <!-- =================================
             HORROR CONFIRMATION
        ================================= -->

        <div
            class="copied-message"
            id="copiedMessage"
        >

            <div class="blood-text">
                COPIED!
            </div>

            <div class="thanks-text">
                Thanks for supporting live music :)
            </div>

        </div>

    </div>


    <!-- =================================
         JAVASCRIPT
    ================================= -->

    <script>


        /* ================================
           COPY BANK DETAILS
        ================================= */

        async function copyCombinedDetails() {


            /*
                ==============================
                YOUR BANK DETAILS
                ==============================
            */

            const name =
                "TAI VAN DER BAR";

            const number =
                "38-9005-0490046-02";


            /*
                ==============================
                TEXT THAT GETS COPIED
                ==============================
            */

            const dynamicText =
                `${name}\n${number}`;


            /*
                Find the button
            */

            const button =
                document.getElementById(
                    "copyDetailsBtn"
                );


            /*
                Find the message
            */

            const message =
                document.getElementById(
                    "copiedMessage"
                );


            try {


                /*
                    ==========================
                    COPY BANK DETAILS
                    ==========================
                */

                await navigator.clipboard.writeText(
                    dynamicText
                );


                /*
                    ==========================
                    CHANGE BUTTON
                    ==========================
                */

                button.innerText =
                    "Copied!";

                button.classList.add(
                    "copied"
                );


                /*
                    ==========================
                    SHOW HORROR MESSAGE
                    ==========================
                */

                message.classList.add(
                    "show"
                );


                /*
                    ==========================
                    CREATE BLOOD SPLATTER
                    ==========================
                */

                createBloodSplatter();


                /*
                    ==========================
                    RESET BUTTON
                    ==========================
                */

                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                    button.classList.remove(
                        "copied"
                    );

                }, 2500);


            }


            catch (err) {


                /*
                    ==========================
                    COPY FAILED
                    ==========================
                */

                console.error(
                    "Could not copy details:",
                    err
                );


                button.innerText =
                    "Copy Failed";


                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                }, 2500);

            }

        }


        /* ================================
           BLOOD SPLATTER GENERATOR
        ================================= */

        function createBloodSplatter() {


            const button =
                document.getElementById(
                    "copyDetailsBtn"
                );


            const rect =
                button.getBoundingClientRect();


            /*
                Create 35 individual
                blood droplets
            */

            for (
                let i = 0;
                i < 35;
                i++
            ) {


                const splat =
                    document.createElement(
                        "div"
                    );


                splat.classList.add(
                    "blood-splat"
                );


                /*
                    Start from centre
                    of button
                */

                splat.style.left =
                    rect.left +
                    rect.width / 2 +
                    "px";


                splat.style.top =
                    rect.top +
                    rect.height / 2 +
                    "px";


                /*
                    Random direction
                */

                const angle =
                    Math.random() *
                    Math.PI *
                    2;


                /*
                    Random distance
                */

                const distance =
                    60 +
                    Math.random() *
                    180;


                /*
                    Horizontal movement
                */

                splat.style.setProperty(
                    "--x",
                    Math.cos(angle) *
                    distance +
                    "px"
                );


                /*
                    Vertical movement
                */

                splat.style.setProperty(
                    "--y",
                    Math.sin(angle) *
                    distance +
                    "px"
                );


                /*
                    Random droplet size
                */

                splat.style.width =
                    5 +
                    Math.random() *
                    15 +
                    "px";


                splat.style.height =
                    5 +
                    Math.random() *
                    15 +
                    "px";


                /*
                    Add to page
                */

                document.body.appendChild(
                    splat
                );


                /*
                    Remove after animation
                */

                setTimeout(function() {

                    splat.remove();

                }, 900);

            }

        }

    </script>


</body>

</html>
