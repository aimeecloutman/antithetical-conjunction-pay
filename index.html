<!DOCTYPE html>
<html lang="en-NZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Antithetical Conjunction - Payment Details</title>

    <style>

        /* ================================
           PAGE / BACKGROUND
        ================================= */

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            /* Your artwork */
            background-image: url("image-1024.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            min-height: 100vh;

            position: relative;
        }


        /* ================================
           BUTTON POSITION
        ================================= */

        .bank-container {

            position: absolute;

            /* Move button up/down here */
            top: 40%;

            /* Centre horizontally */
            left: 50%;

            transform: translate(-50%, -50%);

            /* Button width */
            width: 300px;
        }


        /* ================================
           COPY BUTTON
        ================================= */

        .share-btn {

            width: 100%;

            /* Button height */
            padding: 24px 24px;

            /* White background */
            background: #ffffff;

            /* Black text */
            color: #000000;

            border: none;

            border-radius: 8px;

            /* Text size */
            font-size: 19px;

            font-weight: 700;

            letter-spacing: 0.2px;

            cursor: pointer;

            box-shadow:
                0 5px 18px rgba(0, 0, 0, 0.5);

            transition:
                background 0.2s ease,
                transform 0.1s ease;
        }


        /* ================================
           HOVER
        ================================= */

        .share-btn:hover {

            background: #eeeeee;
        }


        /* ================================
           WHEN PRESSED
        ================================= */

        .share-btn:active {

            transform: scale(0.97);
        }


        /* ================================
           AFTER COPYING
        ================================= */

        .share-btn.copied {

            background: #ffffff;

            color: #000000;
        }


        /* ================================
           PHONE / SMALL SCREEN
        ================================= */

        @media (max-width: 600px) {

            .bank-container {

                width: 340px;

                top: 30%;
            }

            .share-btn {

                padding: 20px 20px;

                font-size: 17px;
            }
        }

    </style>
</head>


<body>


    <!-- =================================
         COPY BANK DETAILS BUTTON
    ================================= -->

    <div class="bank-container">

        <button
            class="share-btn"
            id="copyDetailsBtn"
            onclick="copyCombinedDetails()"
        >
            Copy Bank Details
        </button>

    </div>


    <!-- =================================
         JAVASCRIPT
    ================================= -->

    <script>

        async function copyCombinedDetails() {

            /*
                ==============================
                YOUR BANK DETAILS
                ==============================
            */

            const name =
                "T VAN DER BAR";

            const number =
                "38-9005-0490046-02";


            /*
                ==============================
                TEXT THAT GETS COPIED
                ==============================

                It will copy:

                T VAN DER BAR
                38-9005-0490046-02
            */

            const dynamicText =
                `${name}\n${number}`;


            /*
                Find the button
            */

            const button =
                document.getElementById(
                    "copyDetailsBtn"
                );


            try {

                /*
                    Copy the bank details
                    to the phone clipboard.
                */

                await navigator.clipboard.writeText(
                    dynamicText
                );


                /*
                    Show confirmation
                */

                button.innerText =
                    "Copied!";

                button.classList.add(
                    "copied"
                );


                /*
                    Return to normal after
                    2.5 seconds.
                */

                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                    button.classList.remove(
                        "copied"
                    );

                }, 2500);


            } catch (err) {

                /*
                    If copying doesn't work
                */

                console.error(
                    "Could not copy details:",
                    err
                );


                button.innerText =
                    "Copy Failed";


                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                }, 2500);

            }

        }

    </script>

</body>
</html>
