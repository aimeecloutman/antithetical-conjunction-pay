<!DOCTYPE html>
<html lang="en-NZ">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Antithetical Conjunction - Payment Details</title>


    <style>

        /* ==========================================
           PAGE
        ========================================== */

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;
        }


        body {

            margin: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            background-image:
                url("image-1024.jpg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            min-height: 100vh;

            overflow: hidden;

            position: relative;
        }



        /* ==========================================
           BUTTON
        ========================================== */

        .bank-container {

            position: absolute;

            top: 40%;

            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 240px;

            z-index: 100;
        }


        .share-btn {

            width: 100%;

            padding: 24px;

            background: #ffffff;

            color: #000000;

            border: none;

            border-radius: 8px;

            font-size: 19px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 5px 18px
                rgba(0, 0, 0, 0.5);

            position: relative;

            z-index: 200;
        }


        .share-btn:hover {

            background: #eeeeee;
        }


        .share-btn:active {

            transform: scale(0.97);
        }



        /* ==========================================
           BLOOD SPLAT
        ========================================== */

        .blood {

            position: fixed;

            inset: 0;

            width: 100vw;

            height: 100vh;

            pointer-events: none;

            z-index: 50;

            opacity: 0;

            transform:
                scale(0.05);

            transform-origin:
                50% 40%;

            transition:
                transform 0.55s
                cubic-bezier(.12,.9,.2,1),

                opacity 0.1s ease;
        }


        .blood.active {

            opacity: 1;

            transform:
                scale(1);
        }



        /* ==========================================
           ROUNDED ORGANIC SPLAT
        ========================================== */

        .splat {

            position: absolute;

            left: 50%;

            top: 40%;

            width: 900px;

            height: 700px;

            transform:
                translate(-50%, -50%);

            background:

                radial-gradient(
                    ellipse at 50% 48%,

                    #b00000 0%,

                    #920000 45%,

                    #760000 72%,

                    #570000 100%
                );

            /*
                Rounded organic shape.

                Unlike polygon(), this uses
                rounded blobs and circles.
            */

            border-radius:

                48% 52% 46% 54%
                /
                51% 45% 55% 49%;

            box-shadow:

                0 10px 20px
                rgba(0, 0, 0, 0.35),

                inset
                0 -15px 25px
                rgba(40, 0, 0, 0.3);

            transform-origin:
                center;

            transform:
                translate(-50%, -50%)
                scale(0);

            opacity: 0;

            transition:

                transform 0.55s
                cubic-bezier(.12,.9,.2,1),

                opacity 0.1s ease;
        }


        .blood.active .splat {

            transform:
                translate(-50%, -50%)
                scale(1);

            opacity: 1;
        }



        /* ==========================================
           ORGANIC SPLAT BLOBS
        ========================================== */

        .blob {

            position: absolute;

            background:
                #850000;

            border-radius:
                50%;

            transform:
                scale(0);

            opacity: 0;

            transition:
                transform 0.55s
                cubic-bezier(.1,.9,.2,1);
        }


        .blood.active .blob {

            transform:
                scale(1);

            opacity: 1;
        }


        .blob-1 {

            width: 220px;
            height: 150px;

            left: -100px;
            top: 220px;

            transform:
                rotate(-25deg)
                scale(0);
        }


        .blob-2 {

            width: 250px;
            height: 170px;

            right: -120px;
            top: 180px;

            transform:
                rotate(20deg)
                scale(0);
        }


        .blob-3 {

            width: 170px;
            height: 120px;

            left: 100px;
            top: -80px;
        }


        .blob-4 {

            width: 190px;
            height: 130px;

            right: 100px;
            bottom: -60px;
        }



        /* ==========================================
           PAINT SPLASH TENDRILS
        ========================================== */

        .tendril {

            position: absolute;

            background:
                #790000;

            border-radius:
                50%;

            opacity: 0;

            transform:
                scaleX(0);

            transform-origin:
                center;

            transition:
                transform 0.65s
                cubic-bezier(.1,.9,.2,1),

                opacity 0.2s ease;
        }


        .blood.active .tendril {

            opacity: 1;

            transform:
                scaleX(1);
        }


        .tendril-left {

            width: 500px;
            height: 55px;

            left: -420px;
            top: 45%;

            transform:
                rotate(-8deg)
                scaleX(0);
        }


        .tendril-right {

            width: 500px;
            height: 55px;

            right: -420px;
            top: 42%;

            transform:
                rotate(10deg)
                scaleX(0);
        }


        .tendril-top {

            width: 400px;
            height: 45px;

            top: -270px;
            left: 20%;

            transform:
                rotate(-25deg)
                scaleX(0);
        }


        .tendril-bottom {

            width: 450px;
            height: 50px;

            bottom: -280px;
            right: 20%;

            transform:
                rotate(-20deg)
                scaleX(0);
        }



        /* ==========================================
           BIG BLOOD DRIPS
        ========================================== */

        .drip {

            position: absolute;

            background:
                linear-gradient(
                    to bottom,
                    #850000,
                    #620000
                );

            border-radius:
                0 0 50% 50%;

            transform:
                scaleY(0);

            transform-origin:
                top;

            opacity: 0;

            transition:
                transform 0.8s
                cubic-bezier(.15,.8,.2,1),

                opacity 0.2s ease;
        }


        .blood.active .drip {

            transform:
                scaleY(1);

            opacity: 1;
        }


        .drip-1 {

            width: 38px;
            height: 190px;

            left: 27%;

            top: 62%;

            transition-delay:
                0.05s;
        }


        .drip-2 {

            width: 25px;
            height: 130px;

            left: 39%;

            top: 61%;

            transition-delay:
                0.15s;
        }


        .drip-3 {

            width: 52px;
            height: 250px;

            left: 50%;

            top: 59%;

            transition-delay:
                0.02s;
        }


        .drip-4 {

            width: 28px;
            height: 170px;

            left: 62%;

            top: 61%;

            transition-delay:
                0.2s;
        }


        .drip-5 {

            width: 42px;
            height: 210px;

            left: 73%;

            top: 60%;

            transition-delay:
                0.1s;
        }



        /* ==========================================
           BLOOD DISAPPEARING

           EVERYTHING disappears together.
        ========================================== */

        .blood.draining {

            opacity: 0;

            transform:
                scale(1.08)
                translateY(40px);

            transition:

                opacity 2.5s ease,

                transform 2.5s ease;
        }


        .blood.draining .drip {

            transform:
                scaleY(0);

            opacity: 0;

            transition:
                transform 1.5s ease-in,

                opacity 1.2s ease;
        }



        /* ==========================================
           THANK YOU MESSAGE
        ========================================== */

        .thanks-message {

            position: absolute;

            top:
                calc(100% + 30px);

            left: 50%;

            transform:
                translateX(-50%);

            width: 340px;

            text-align: center;

            opacity: 0;

            z-index: 80;

            pointer-events: none;

            transition:
                opacity 1.2s ease;
        }


        .thanks-message.show {

            opacity: 1;
        }



        /* ==========================================
           BLOOD LETTERING
        ========================================== */

        .thanks-text {

            position: relative;

            display: inline-block;

            color:
                #700000;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                23px;

            font-weight:
                900;

            line-height:
                1.2;

            letter-spacing:
                0.4px;

            text-shadow:

                1px 2px 0
                #3b0000,

                0 3px 4px
                rgba(0, 0, 0, 0.55);
        }


        /*
            BLOOD DRIPS ATTACHED
            TO THE ACTUAL WORDS
        */

        .thanks-text::before {

            content: "";

            position: absolute;

            left: 12%;

            bottom: -24px;

            width: 10px;

            height: 32px;

            background:
                linear-gradient(
                    to bottom,
                    #700000,
                    #4b0000
                );

            border-radius:
                0 0 50% 50%;

            box-shadow:

                55px 7px 0 -2px #700000,

                118px 2px 0 -3px #700000,

                190px 5px 0 -3px #700000;
        }


        .thanks-text::after {

            content: "";

            position: absolute;

            right: 9%;

            bottom: -17px;

            width: 7px;

            height: 24px;

            background:
                #700000;

            border-radius:
                0 0 50% 50%;
        }



        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            .bank-container {

                width: 225px;

                top: 30%;
            }


            .share-btn {

                padding: 20px;

                font-size: 17px;
            }


            .splat {

                width: 600px;

                height: 560px;
            }


            .tendril {

                display: none;
            }


            .thanks-message {

                width: 280px;
            }


            .thanks-text {

                font-size: 19px;
            }


            .drip-1 {

                left: 15%;
            }


            .drip-2 {

                left: 30%;
            }


            .drip-3 {

                left: 48%;
            }


            .drip-4 {

                left: 65%;
            }


            .drip-5 {

                left: 80%;
            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         BLOOD SPLAT
    ========================================== -->

    <div
        class="blood"
        id="blood"
    >

        <div class="splat">

            <div class="blob blob-1"></div>

            <div class="blob blob-2"></div>

            <div class="blob blob-3"></div>

            <div class="blob blob-4"></div>


            <div class="tendril tendril-left"></div>

            <div class="tendril tendril-right"></div>

            <div class="tendril tendril-top"></div>

            <div class="tendril tendril-bottom"></div>

        </div>


        <!-- DRIPS -->

        <div class="drip drip-1"></div>

        <div class="drip drip-2"></div>

        <div class="drip drip-3"></div>

        <div class="drip drip-4"></div>

        <div class="drip drip-5"></div>

    </div>



    <!-- ==========================================
         BUTTON
    ========================================== -->

    <div class="bank-container">

        <button
            class="share-btn"
            id="copyDetailsBtn"
            onclick="copyCombinedDetails()"
        >
            Copy Bank Details
        </button>


        <!-- ======================================
             MESSAGE
        ====================================== -->

        <div
            class="thanks-message"
            id="thanksMessage"
        >

            <div class="thanks-text">

                Thanks for supporting live music :)

            </div>

        </div>

    </div>



    <script>


        /* ==========================================
           COPY BANK DETAILS
        ========================================== */

        async function copyCombinedDetails() {


            const name =
                "TAI VAN DER BAR";


            const number =
                "38-9005-0490046-02";


            const dynamicText =
                `${name}\n${number}`;


            const button =
                document.getElementById(
                    "copyDetailsBtn"
                );


            const blood =
                document.getElementById(
                    "blood"
                );


            const message =
                document.getElementById(
                    "thanksMessage"
                );


            try {


                /* ==================================
                   COPY BANK DETAILS
                ================================== */

                await navigator.clipboard.writeText(
                    dynamicText
                );


                /* ==================================
                   CHANGE BUTTON TEXT
                ================================== */

                button.innerText =
                    "Copied!";


                /* ==================================
                   SPLAT
                ================================== */

                blood.classList.add(
                    "active"
                );


                /* ==================================
                   LET IT SIT FOR 3 SECONDS
                ================================== */

                setTimeout(function() {


                    /*
                       Blood begins disappearing.
                    */

                    blood.classList.add(
                        "draining"
                    );


                    /*
                       Message appears.
                    */

                    message.classList.add(
                        "show"
                    );


                }, 3000);


                /* ==================================
                   RESET BUTTON
                ================================== */

                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                }, 5000);

            }


            catch (err) {


                console.error(
                    "Could not copy details:",
                    err
                );


                button.innerText =
                    "Copy Failed";


                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                }, 2500);

            }

        }

    </script>


</body>

</html>
