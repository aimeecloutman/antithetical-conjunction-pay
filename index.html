<!DOCTYPE html>
<html lang="en-NZ">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Antithetical Conjunction - Payment Details</title>


    <!-- Horror / blood-style font -->
    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Nosifer&display=swap"
        rel="stylesheet"
    >


    <style>

        /* ==========================================
           PAGE
        ========================================== */

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;
        }


        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            background-image:
                url("image-1024.jpg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            min-height: 100vh;

            overflow: hidden;

            position: relative;
        }



        /* ==========================================
           BLOOD COLOUR
        ========================================== */

        :root {

            --blood:
                #850000;
        }



        /* ==========================================
           BUTTON
        ========================================== */

        .bank-container {

            position: absolute;

            top: 40%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 240px;

            z-index: 100;
        }


        .share-btn {

            width: 100%;

            padding: 24px;

            background: #ffffff;

            color: #000000;

            border: none;

            border-radius: 8px;

            font-size: 19px;

            font-weight: 700;

            letter-spacing: 0.2px;

            cursor: pointer;

            box-shadow:
                0 5px 18px
                rgba(0, 0, 0, 0.5);

            position: relative;

            z-index: 200;
        }


        .share-btn:hover {

            background: #eeeeee;
        }


        .share-btn:active {

            transform:
                scale(0.97);
        }



        /* ==========================================
           BLOOD CONTAINER
        ========================================== */

        .blood {

            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            pointer-events: none;

            z-index: 50;

            opacity: 0;
        }


        .blood.active {

            opacity: 1;
        }



        /* ==========================================
           GIANT CARTOON SPLAT
           
           Thin arms start from the central mass,
           then dramatically balloon into rounded
           ends which reach toward the edges.
        ========================================== */

        .blood-splat {

            position: absolute;

            left: 50%;
            top: 40%;

            /*
                Much larger than before so the splat
                can spread over almost the entire page.
            */

            width: min(1450px, 165vw);

            height: min(1050px, 125vh);

            transform:
                translate(-50%, -50%)
                scale(0);

            transform-origin:
                center;

            opacity: 0;

            filter:
                drop-shadow(
                    0 10px 15px
                    rgba(0, 0, 0, 0.25)
                );

            transition:

                transform
                0.85s
                cubic-bezier(.08, 1.25, .2, 1),

                opacity
                0.15s ease;
        }


        .blood.active .blood-splat {

            transform:
                translate(-50%, -50%)
                scale(1);

            opacity: 1;
        }


        .blood-shape {

            fill:
                var(--blood);
        }



        /* ==========================================
           OUTER SPLASH DOTS
           
           Bigger and more widely distributed so
           the whole screen participates in the
           effect.
        ========================================== */

        .blood-dot {

            position: absolute;

            background:
                var(--blood);

            border-radius: 50%;

            opacity: 0;

            transform:
                scale(0);

            transition:

                transform
                0.55s
                cubic-bezier(.1, 1.3, .2, 1),

                opacity
                0.12s ease;
        }


        .blood.active .blood-dot {

            opacity: 1;

            transform:
                scale(1);
        }


        .dot-1 {

            left: 4%;
            top: 16%;

            width: 42px;
            height: 42px;

            transition-delay:
                0.05s;
        }


        .dot-2 {

            left: 13%;
            top: 7%;

            width: 22px;
            height: 22px;

            transition-delay:
                0.12s;
        }


        .dot-3 {

            left: 3%;
            top: 62%;

            width: 30px;
            height: 30px;

            transition-delay:
                0.18s;
        }


        .dot-4 {

            left: 18%;
            bottom: 7%;

            width: 38px;
            height: 38px;

            transition-delay:
                0.08s;
        }


        .dot-5 {

            right: 4%;
            top: 13%;

            width: 45px;
            height: 45px;

            transition-delay:
                0.10s;
        }


        .dot-6 {

            right: 14%;
            top: 5%;

            width: 21px;
            height: 21px;

            transition-delay:
                0.16s;
        }


        .dot-7 {

            right: 2%;
            top: 58%;

            width: 34px;
            height: 34px;

            transition-delay:
                0.2s;
        }


        .dot-8 {

            right: 17%;
            bottom: 6%;

            width: 42px;
            height: 42px;

            transition-delay:
                0.14s;
        }


        .dot-9 {

            left: 28%;
            top: 3%;

            width: 14px;
            height: 14px;

            transition-delay:
                0.20s;
        }


        .dot-10 {

            right: 28%;
            top: 4%;

            width: 17px;
            height: 17px;

            transition-delay:
                0.23s;
        }



        /* ==========================================
           DRAINING / FADING
           
           The splat does NOT visibly shrink away.
           It simply fades out, giving the impression
           that the blood is disappearing from the
           page.
        ========================================== */

        .blood.draining {

            opacity: 0;

            transition:
                opacity
                1.45s
                ease;
        }


        .blood.draining
        .blood-splat {

            transform:
                translate(-50%, -50%)
                scale(1);

            opacity: 0;

            transition:

                opacity
                1.45s
                ease;
        }


        .blood.draining
        .blood-dot {

            transform:
                scale(1);

            opacity: 0;

            transition:

                opacity
                1s
                ease;
        }



        /* ==========================================
           THANK YOU MESSAGE
        ========================================== */

        .thanks-message {

            position: absolute;

            top:
                calc(100% + 32px);

            left: 50%;

            transform:
                translateX(-50%)
                translateY(10px);

            width: 370px;

            text-align: center;

            opacity: 0;

            z-index: 80;

            pointer-events: none;

            transition:

                opacity
                1s ease,

                transform
                1s ease;
        }


        .thanks-message.show {

            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);
        }



        /* ==========================================
           NOSIFER THANK-YOU TEXT
        ========================================== */

        .thanks-text {

            position: relative;

            display: inline-block;

            color:
                var(--blood);

            font-family:
                "Nosifer",
                cursive;

            font-size:
                25px;

            line-height:
                1.4;

            letter-spacing:
                0.5px;

            text-shadow:

                1px 2px 0
                rgba(40, 0, 0, 0.8),

                0 3px 6px
                rgba(0, 0, 0, 0.4);
        }



        /* ==========================================
           NO STATIC DRIPS
        ========================================== */



        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            .bank-container {

                width: 225px;

                top: 30%;
            }


            .share-btn {

                padding: 20px;

                font-size: 17px;
            }


            .blood-splat {

                width: 1150px;

                height: 900px;
            }


            .thanks-message {

                width: 290px;
            }


            .thanks-text {

                font-size: 20px;
            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         BLOOD SPLAT
    ========================================== -->

    <div
        class="blood"
        id="blood"
    >


        <svg
            class="blood-splat"
            viewBox="0 0 1000 760"
            xmlns="http://www.w3.org/2000/svg"
        >

            <!--
                GIANT CARTOON BLOOD SPLAT

                Each arm is intentionally narrow near
                the centre before swelling outward into
                a rounded bulb.

                This creates a more "ballooned" splat
                rather than sharp triangular spikes.
            -->

            <path
                class="blood-shape"
                d="
                M 500 255

                C 485 240 470 222 455 202
                C 438 180 424 154 408 135
                C 394 118 374 116 363 128
                C 351 141 359 160 374 177
                C 393 199 414 220 438 242

                C 414 232 388 219 360 205
                C 334 192 306 181 284 188
                C 264 194 260 211 273 225
                C 287 240 312 244 337 247
                C 371 252 403 254 432 260

                C 397 263 358 260 323 258
                C 291 256 256 254 229 266
                C 207 276 203 297 218 311
                C 235 327 265 328 294 324
                C 337 318 377 305 419 295

                C 389 313 361 332 336 353
                C 308 377 284 402 287 424
                C 290 445 311 451 328 438
                C 350 421 365 394 381 372
                C 399 348 417 326 439 310

                C 425 344 413 376 405 409
                C 397 442 394 477 411 493
                C 426 507 447 498 454 477
                C 464 448 460 414 463 382
                C 465 352 470 326 478 306

                C 476 344 475 382 480 416
                C 485 449 492 482 511 493
                C 530 504 548 490 550 468
                C 553 438 542 408 536 379
                C 530 350 526 324 527 304

                C 542 334 558 362 576 389

                C 651 449 664 434 660 416

                C 592 327 576 306 563 286

                C 591 300 622 316 655 327
                C 686 338 718 349 741 341
                C 761 334 767 315 754 301
                C 741 286 712 285 685 287
                C 647 289 616 286 584 278

                C 616 265 649 250 679 232
                C 706 216 730 197 728 177
                C 726 157 707 149 689 159
                C 665 172 648 194 629 213
                C 610 232 591 247 570 259

                C 586 234 601 208 615 181
                C 628 156 637 127 624 111
                C 611 95 590 103 580 121
                C 566 146 561 175 550 201
                C 540 224 529 241 516 256

                C 511 247 505 245 500 255

                Z
                "
            />

        </svg>



        <!-- ==========================================
             OUTER SPLASH DOTS
        ========================================== -->

        <div class="blood-dot dot-1"></div>

        <div class="blood-dot dot-2"></div>

        <div class="blood-dot dot-3"></div>

        <div class="blood-dot dot-4"></div>

        <div class="blood-dot dot-5"></div>

        <div class="blood-dot dot-6"></div>

        <div class="blood-dot dot-7"></div>

        <div class="blood-dot dot-8"></div>

        <div class="blood-dot dot-9"></div>

        <div class="blood-dot dot-10"></div>


    </div>



    <!-- ==========================================
         BUTTON
    ========================================== -->

    <div class="bank-container">


        <button
            class="share-btn"
            id="copyDetailsBtn"
            onclick="copyCombinedDetails()"
        >

            Copy Bank Details

        </button>


        <!-- THANK YOU -->

        <div
            class="thanks-message"
            id="thanksMessage"
        >

            <div class="thanks-text">

                Thanks for supporting live music :)

            </div>

        </div>


    </div>



    <script>


        /* ==========================================
           COPY BANK DETAILS
        ========================================== */

        async function copyCombinedDetails() {


            const name =
                "TAI VAN DER BAR";


            const number =
                "38-9005-0490046-02";


            const dynamicText =
                `${name}\n${number}`;


            const button =
                document.getElementById(
                    "copyDetailsBtn"
                );


            const blood =
                document.getElementById(
                    "blood"
                );


            const message =
                document.getElementById(
                    "thanksMessage"
                );


            try {


                /* ==============================
                   COPY
                ============================== */

                await navigator.clipboard.writeText(
                    dynamicText
                );


                /* ==============================
                   BUTTON
                ============================== */

                button.innerText =
                    "Copied!";


                /* ==============================
                   RESET ANY PREVIOUS ANIMATION
                ============================== */

                blood.classList.remove(
                    "draining"
                );

                blood.classList.remove(
                    "active"
                );


                /*
                    Force the browser to recognise
                    the reset before starting the
                    animation again.
                */

                void blood.offsetWidth;


                /* ==============================
                   BLOOD SPLAT
                ============================== */

                blood.classList.add(
                    "active"
                );


                /* ==============================
                   BLOOD STAYS FOR 3 SECONDS
                ============================== */

                setTimeout(function() {

                    blood.classList.add(
                        "draining"
                    );

                }, 3000);


                /* ==============================
                   THANK YOU
                ================================= */

                setTimeout(function() {

                    message.classList.add(
                        "show"
                    );

                }, 4400);


                /* ==============================
                   RESET BUTTON
                ================================= */

                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                }, 5000);

            }


            catch (err) {


                console.error(
                    "Could not copy details:",
                    err
                );


                button.innerText =
                    "Copy Failed";


                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                }, 2500);

            }

        }

    </script>


</body>

</html>
