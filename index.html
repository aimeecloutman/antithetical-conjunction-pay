<!DOCTYPE html>
<html lang="en-NZ">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Antithetical Conjunction - Payment Details</title>

    <style>

        /* =========================================
           PAGE
        ========================================= */

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            background-image: url("image-1024.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            min-height: 100vh;

            position: relative;
            overflow: hidden;
        }


        /* =========================================
           BUTTON
        ========================================= */

        .bank-container {
            position: absolute;

            top: 40%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 240px;

            z-index: 100;
        }


        .share-btn {
            width: 100%;

            padding: 24px;

            background: #ffffff;
            color: #000000;

            border: none;
            border-radius: 8px;

            font-size: 19px;
            font-weight: 700;

            letter-spacing: 0.2px;

            cursor: pointer;

            box-shadow:
                0 5px 18px rgba(0, 0, 0, 0.5);

            position: relative;
            z-index: 200;

            transition:
                background 0.2s ease;
        }


        .share-btn:hover {
            background: #eeeeee;
        }


        .share-btn:active {
            transform: scale(0.97);
        }


        /* =========================================
           THANK-YOU MESSAGE
        ========================================= */

        .thanks-message {
            position: absolute;

            top: calc(100% + 30px);

            left: 50%;

            transform:
                translateX(-50%);

            width: 340px;

            text-align: center;

            opacity: 0;

            z-index: 90;

            pointer-events: none;

            transition:
                opacity 1.4s ease;
        }


        .thanks-message.show {
            opacity: 1;
        }


        /* =========================================
           BLOODY LETTERING
        ========================================= */

        .thanks-text {
            position: relative;

            color: #720000;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 23px;

            font-weight: 900;

            line-height: 1.25;

            letter-spacing: 0.5px;

            text-shadow:
                1px 2px 0 #350000,
                0 3px 6px
                rgba(0, 0, 0, 0.65);

            display: inline-block;
        }


        /*
           Individual hanging drips
        */

        .thanks-text::before {
            content: "";

            position: absolute;

            left: 17%;

            bottom: -25px;

            width: 9px;
            height: 32px;

            background:
                linear-gradient(
                    to bottom,
                    #720000,
                    #4d0000
                );

            border-radius:
                0 0 50% 50%;

            box-shadow:
                65px 4px 0 -2px #720000,
                130px -3px 0 -3px #720000;
        }


        .thanks-text::after {
            content: "";

            position: absolute;

            right: 16%;

            bottom: -17px;

            width: 6px;
            height: 21px;

            background: #720000;

            border-radius:
                0 0 50% 50%;
        }


        /* =========================================
           GIANT SPLAT
        ========================================= */

        .splat {
            position: fixed;

            left: 50%;
            top: 40%;

            width: 0;
            height: 0;

            z-index: 50;

            pointer-events: none;
        }


        /*
           Main paint blob.

           Starts tiny and expands from
           exactly where the button is.
        */

        .splat-main {

            position: absolute;

            left: -300px;
            top: -250px;

            width: 600px;
            height: 500px;

            background:
                radial-gradient(
                    ellipse at 50% 48%,
                    #a90000 0%,
                    #850000 55%,
                    #650000 80%,
                    #4a0000 100%
                );

            /*
               Irregular paint-splat outline.
            */

            clip-path:
                polygon(

                    50% 0%,
                    57% 15%,
                    64% 5%,
                    67% 21%,
                    78% 8%,
                    77% 25%,
                    92% 14%,
                    86% 31%,
                    100% 27%,
                    91% 40%,

                    100% 49%,

                    91% 55%,
                    98% 67%,
                    82% 63%,
                    91% 80%,
                    75% 72%,
                    77% 94%,
                    64% 79%,
                    59% 100%,
                    50% 82%,

                    40% 100%,
                    36% 80%,
                    22% 94%,
                    24% 73%,
                    8% 82%,
                    17% 65%,
                    2% 68%,
                    9% 55%,

                    0% 48%,
                    10% 39%,
                    0% 27%,
                    15% 31%,
                    8% 14%,
                    23% 25%,
                    22% 8%,
                    34% 21%,
                    37% 5%,
                    43% 15%
                );

            transform:
                scale(0);

            opacity: 0;

            transition:
                transform 0.65s
                cubic-bezier(.12,.85,.18,1),

                opacity 0.1s ease;
        }


        /* =========================================
           SPLAT APPEARS
        ========================================= */

        .splat.active
        .splat-main {

            transform:
                scale(1);

            opacity: 1;
        }


        /* =========================================
           HUGE PAINT FINGERS
        ========================================= */

        .paint-finger {

            position: fixed;

            background:
                linear-gradient(
                    180deg,
                    #8d0000,
                    #600000
                );

            z-index: 48;

            pointer-events: none;

            transform:
                scale(0);

            transform-origin:
                center;

            opacity: 0;

            transition:
                transform 0.7s
                cubic-bezier(.1,.9,.2,1),

                opacity 0.2s ease;

            border-radius:
                50%;
        }


        /*
           Left
        */

        .finger-left {

            width: 280px;
            height: 100px;

            left: -20px;
            top: 37%;

            transform:
                rotate(-18deg)
                scale(0);
        }


        /*
           Right
        */

        .finger-right {

            width: 320px;
            height: 115px;

            right: -30px;
            top: 42%;

            transform:
                rotate(15deg)
                scale(0);
        }


        /*
           Top-left
        */

        .finger-top {

            width: 230px;
            height: 90px;

            left: 10%;
            top: 12%;

            transform:
                rotate(28deg)
                scale(0);
        }


        /*
           Bottom-right
        */

        .finger-bottom {

            width: 250px;
            height: 95px;

            right: 12%;
            bottom: 15%;

            transform:
                rotate(-25deg)
                scale(0);
        }


        .splat.active
        ~ .paint-finger {

            opacity: 1;

            transform:
                scale(1);
        }


        /* =========================================
           LONG DRIPS FROM THE SPLAT
        ========================================= */

        .drip {

            position: fixed;

            top: 54%;

            width: var(--width);
            height: var(--height);

            left: var(--left);

            background:
                linear-gradient(
                    180deg,
                    #870000 0%,
                    #680000 70%,
                    #4b0000 100%
                );

            border-radius:
                0 0 50% 50%;

            transform:
                scaleY(0);

            transform-origin: top;

            z-index: 51;

            pointer-events: none;

            opacity: 0;

            transition:
                transform 1.2s
                cubic-bezier(.15,.8,.2,1),

                opacity 0.2s ease;
        }


        .splat.active
        ~ .drip {

            transform:
                scaleY(1);

            opacity: 1;
        }


        /* =========================================
           DRIP SIZES
        ========================================= */

        .drip-1 {

            --left: 20%;
            --width: 30px;
            --height: 220px;

        }


        .drip-2 {

            --left: 34%;
            --width: 18px;
            --height: 140px;

        }


        .drip-3 {

            --left: 48%;
            --width: 42px;
            --height: 290px;

        }


        .drip-4 {

            --left: 63%;
            --width: 22px;
            --height: 190px;

        }


        .drip-5 {

            --left: 76%;
            --width: 32px;
            --height: 230px;

        }


        /* =========================================
           DRIP FADE
        ========================================= */

        .splat.draining
        .splat-main {

            animation:
                bloodDrain 3s
                ease-in forwards;
        }


        @keyframes bloodDrain {

            0% {
                opacity: 1;
                transform:
                    scale(1);
            }

            60% {
                opacity: 0.8;
                transform:
                    scale(1.02)
                    translateY(15px);
            }

            100% {
                opacity: 0;
                transform:
                    scale(1.08)
                    translateY(60px);
            }
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .bank-container {

                width: 225px;

                top: 30%;
            }


            .share-btn {

                padding: 20px;

                font-size: 17px;
            }


            .splat-main {

                left: -220px;
                top: -220px;

                width: 440px;
                height: 440px;
            }


            .thanks-message {

                width: 280px;
            }


            .thanks-text {

                font-size: 19px;
            }


            .paint-finger {

                display: none;
            }


            .drip-1 {
                --left: 15%;
            }

            .drip-2 {
                --left: 30%;
            }

            .drip-3 {
                --left: 48%;
            }

            .drip-4 {
                --left: 65%;
            }

            .drip-5 {
                --left: 80%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         GIANT SPLAT
    ========================================== -->

    <div
        class="splat"
        id="splat"
    >

        <div
            class="splat-main"
        ></div>

    </div>


    <!-- =========================================
         SPLAT EXTENSIONS
    ========================================== -->

    <div
        class="paint-finger finger-left"
    ></div>

    <div
        class="paint-finger finger-right"
    ></div>

    <div
        class="paint-finger finger-top"
    ></div>

    <div
        class="paint-finger finger-bottom"
    ></div>


    <!-- =========================================
         DRIPS
    ========================================== -->

    <div
        class="drip drip-1"
    ></div>

    <div
        class="drip drip-2"
    ></div>

    <div
        class="drip drip-3"
    ></div>

    <div
        class="drip drip-4"
    ></div>

    <div
        class="drip drip-5"
    ></div>


    <!-- =========================================
         BUTTON
    ========================================== -->

    <div class="bank-container">

        <button
            class="share-btn"
            id="copyDetailsBtn"
            onclick="copyCombinedDetails()"
        >
            Copy Bank Details
        </button>


        <!-- =====================================
             BLOODY THANK-YOU
        ====================================== -->

        <div
            class="thanks-message"
            id="thanksMessage"
        >

            <div class="thanks-text">

                Thanks for supporting live music :)

            </div>

        </div>

    </div>



    <script>


        /* =========================================
           COPY BANK DETAILS
        ========================================= */

        async function copyCombinedDetails() {


            const name =
                "TAI VAN DER BAR";


            const number =
                "38-9005-0490046-02";


            const dynamicText =
                `${name}\n${number}`;


            const button =
                document.getElementById(
                    "copyDetailsBtn"
                );


            const splat =
                document.getElementById(
                    "splat"
                );


            const message =
                document.getElementById(
                    "thanksMessage"
                );


            try {


                /* ==============================
                   COPY
                ============================== */

                await navigator.clipboard.writeText(
                    dynamicText
                );


                /* ==============================
                   BUTTON DOES NOT MOVE
                ============================== */

                button.innerText =
                    "Copied!";


                /* ==============================
                   EXPLODE THE PAINT
                ============================== */

                splat.classList.add(
                    "active"
                );


                /* ==============================
                   AFTER THE SPLAT HAS LANDED
                ============================== */

                setTimeout(function() {

                    /*
                       Start draining the
                       giant paint splat.
                    */

                    splat.classList.add(
                        "draining"
                    );


                    /*
                       Reveal bloody message.
                    */

                    message.classList.add(
                        "show"
                    );

                }, 3200);


                /* ==============================
                   RESET BUTTON
                ============================== */

                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                }, 5000);

            }


            catch (err) {


                console.error(
                    "Could not copy details:",
                    err
                );


                button.innerText =
                    "Copy Failed";


                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                }, 2500);

            }

        }

    </script>


</body>

</html>
