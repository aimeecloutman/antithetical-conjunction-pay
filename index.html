!DOCTYPE html> <html lang="en-NZ"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antithetical Conjunction - Payment Details</title>

<!-- Silly meme font -->
<link
    href="https://fonts.googleapis.com/css2?family=Bangers&display=swap"
    rel="stylesheet"
>

<style>

    /* ================================
       PAGE / BACKGROUND
    ================================= */

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
    }

    body {
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            sans-serif;

        background-image: url("image-1024.jpg");

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        min-height: 100vh;

        position: relative;

        /* Prevent monster from creating
           unwanted scrolling */
        overflow: hidden;
    }


    /* ================================
       BUTTON POSITION
    ================================= */

    .bank-container {

        position: absolute;

        top: 40%;

        left: 50%;

        transform: translate(-50%, -50%);

        width: 240px;

        z-index: 2;
    }


    /* ================================
       COPY BUTTON
    ================================= */

    .share-btn {

        width: 100%;

        padding: 24px 24px;

        background: #ffffff;

        color: #000000;

        border: none;

        border-radius: 8px;

        font-size: 19px;

        font-weight: 700;

        letter-spacing: 0.2px;

        cursor: pointer;

        box-shadow:
            0 5px 18px rgba(0, 0, 0, 0.5);

        transition:
            background 0.2s ease,
            transform 0.1s ease;
    }


    /* ================================
       HOVER
    ================================= */

    .share-btn:hover {

        background: #eeeeee;
    }


    /* ================================
       WHEN PRESSED
    ================================= */

    .share-btn:active {

        transform: scale(0.97);
    }


    /* ================================
       COPIED BUTTON
    ================================= */

    .share-btn.copied {

        background: #ffffff;

        color: #000000;
    }


    /* ================================
       THANK YOU CONTAINER
    ================================= */

    .thank-you {

        position: absolute;

        top: 62%;

        left: 50%;

        transform:
            translate(-50%, -50%)
            scale(0.7);

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        gap: 8px;

        width: 90%;

        opacity: 0;

        visibility: hidden;

        pointer-events: none;

        z-index: 3;

        transition:
            opacity 0.5s ease,
            transform 0.5s ease;
    }


    /* ================================
       THANK YOU TEXT
    ================================= */

    .thank-you-message {

        color: white;

        font-family:
            "Bangers",
            "Impact",
            "Arial Black",
            sans-serif;

        font-size:
            clamp(30px, 6vw, 58px);

        line-height: 0.95;

        text-align: center;

        text-transform: uppercase;

        letter-spacing: 1px;

        transform: rotate(-3deg);

        text-shadow:
            5px 5px 0 #000000,
            -2px -2px 0 #000000,
            2px -2px 0 #000000,
            -2px 2px 0 #000000;
    }


    /* ================================
       BIG MONSTER
    ================================= */

    .thank-you img {

        width: 700px;

        max-width: 70vw;

        height: auto;

        display: block;

        filter:
            drop-shadow(
                0 10px 10px rgba(0, 0, 0, 0.5)
            );

        animation:
            monsterWiggle 2s ease-in-out infinite;
    }


    /* ================================
       SHOW THANK YOU
    ================================= */

    .thank-you.show {

        opacity: 1;

        visibility: visible;

        transform:
            translate(-50%, -50%)
            scale(1);
    }


    /* ================================
       WIGGLE
    ================================= */

    @keyframes monsterWiggle {

        0% {
            transform: rotate(-2deg);
        }

        50% {
            transform:
                rotate(2deg)
                translateY(-5px);
        }

        100% {
            transform: rotate(-2deg);
        }
    }


    /* ================================
       PHONE / SMALL SCREEN
    ================================= */

    @media (max-width: 600px) {

        .bank-container {

            width: 225px;

            top: 30%;
        }


        .share-btn {

            padding: 20px 20px;

            font-size: 17px;
        }


        .thank-you {

            top: 62%;

            width: 95%;

            gap: 5px;
        }


        .thank-you-message {

            font-size: 32px;

            line-height: 0.9;
        }


        .thank-you img {

            width: 700px;

            max-width: 75vw;
        }
    }

</style>

</head> <body>
<!-- =================================
     COPY BANK DETAILS BUTTON
================================= -->

<div class="bank-container">

    <button
        class="share-btn"
        id="copyDetailsBtn"
        onclick="copyCombinedDetails()"
    >
        Copy Bank Details
    </button>

</div>


<!-- =================================
     THANK YOU MESSAGE
================================= -->

<div
    class="thank-you"
    id="thankYou"
>

    <div class="thank-you-message">
        Thanks for supporting<br>
        live music :D
    </div>

    <img
        src="image.png"
        alt="Silly monster"
    >

</div>


<!-- =================================
     JAVASCRIPT
================================= -->

<script>

    async function copyCombinedDetails() {

        /*
            ==============================
            YOUR BANK DETAILS
            ==============================
        */

        const name =
            "TAI VAN DER BAR";

        const number =
            "38-9005-0490046-02";


        /*
            ==============================
            TEXT THAT GETS COPIED
            ==============================
        */

        const dynamicText =
            `${name}\n${number}`;


        /*
            Find the button
        */

        const button =
            document.getElementById(
                "copyDetailsBtn"
            );


        /*
            Find the thank-you section
        */

        const thankYou =
            document.getElementById(
                "thankYou"
            );


        try {

            /*
                Copy the bank details
                to the phone clipboard.
            */

            await navigator.clipboard.writeText(
                dynamicText
            );


            /*
                Show confirmation
            */

            button.innerText =
                "Copied!";

            button.classList.add(
                "copied"
            );


            /*
                Show monster + message
            */

            thankYou.classList.add(
                "show"
            );


            /*
                Return button to normal
                after 2.5 seconds.
            */

            setTimeout(function() {

                button.innerText =
                    "Copy Bank Details";

                button.classList.remove(
                    "copied"
                );

            }, 2500);


        } catch (err) {

            /*
                If copying doesn't work
            */

            console.error(
                "Could not copy details:",
                err
            );


            button.innerText =
                "Copy Failed";


            setTimeout(function() {

                button.innerText =
                    "Copy Bank Details";

            }, 2500);

        }

    }

</script>

</body> </html>
