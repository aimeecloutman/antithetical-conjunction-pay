<!DOCTYPE html>
<html lang="en-NZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Antithetical Conjunction - Payment Details</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            /* Your artwork */
            background-image: url("image-1024.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            min-height: 100vh;

            position: relative;
        }


        /* -----------------------------------
           BUTTON POSITION
        ----------------------------------- */

        .bank-container {
            position: absolute;

            /*
                Change this number to move
                the button up or down.

                Smaller = higher
                Larger = lower
            */

            top: 48%;

            left: 50%;

            transform: translate(-50%, -50%);

            width: 280px;
        }


        /* -----------------------------------
           WHITE COPY BUTTON
        ----------------------------------- */

        .share-btn {

            width: 100%;

            padding: 14px 20px;

            background: #ffffff;

            color: #000000;

            border: none;

            border-radius: 7px;

            font-size: 16px;

            font-weight: 700;

            letter-spacing: 0.2px;

            cursor: pointer;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.5);

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.1s ease;
        }


        /* Hover effect */

        .share-btn:hover {

            background: #eeeeee;

            color: #000000;
        }


        /* Pressed effect */

        .share-btn:active {

            transform: scale(0.97);
        }


        /* After copying */

        .share-btn.copied {

            background: #ffffff;

            color: #000000;
        }


        /* -----------------------------------
           MOBILE
        ----------------------------------- */

        @media (max-width: 600px) {

            .bank-container {

                width: 240px;

                top: 48%;
            }

            .share-btn {

                font-size: 15px;

                padding: 13px 16px;
            }
        }

    </style>
</head>


<body>


    <!--
        The bank details are stored here in
        the JavaScript below but are NOT shown.
    -->

    <div class="bank-container">

        <button
            class="share-btn"
            id="copyDetailsBtn"
            onclick="copyCombinedDetails()"
        >
            Copy Bank Details
        </button>

    </div>


    <script>

        async function copyCombinedDetails() {

            /*
                YOUR BANK DETAILS
            */

            const name = "T X VAN DER BAR";

            const number = "12-XXXX-XXXXXXX-00";

            const reference = "AConjunction";


            /*
                This creates:

                T X VAN DER BAR
                12-XXXX-XXXXXXX-00
                AConjunction
            */

            const dynamicText =
                `${name}\n${number}\n${reference}`;


            const button =
                document.getElementById("copyDetailsBtn");


            try {

                await navigator.clipboard.writeText(
                    dynamicText
                );


                button.innerText = "Copied!";


                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                }, 2500);


            } catch (err) {

                console.error(
                    "Could not copy details:",
                    err
                );


                button.innerText =
                    "Copy Failed";


                setTimeout(function() {

                    button.innerText =
                        "Copy Bank Details";

                }, 2500);

            }

        }

    </script>

</body>
</html>
